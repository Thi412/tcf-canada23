<script>
const MOCK_TESTS=window.__MOCK_TESTS__||[];
const WRITING_PROMPTS=[
  {id:1,task:"tache1",theme:"🎉 Invitations & événements",title:"Fête d'anniversaire surprise",level:"A2-B1",prompt:"Rédigez un courriel à vos amis pour les convier à une fête d'anniversaire surprise organisée en l'honneur de votre meilleur ami. Mentionnez les détails essentiels : lieu, date, heure et toute autre information importante. (60–80 mots)"},
  {id:2,task:"tache1",theme:"🎉 Invitations & événements",title:"Organiser une fête",level:"A2-B1",prompt:"Vous souhaitez organiser une fête et inviter vos amis tout en leur demandant un coup de main pour la préparation (lieu, date, thème, etc.). (60–80 mots)"},
  {id:3,task:"tache1",theme:"🎉 Invitations & événements",title:"Anniversaire au restaurant",level:"A2-B1",prompt:"Envoyez un courriel à vos amis pour les inviter à fêter votre anniversaire dans un restaurant. Incluez toutes les informations nécessaires : lieu, date, menu, prix, et demandez-leur de confirmer leur présence. (60–80 mots)"},
  {id:4,task:"tache1",theme:"🎉 Invitations & événements",title:"Week-end entre amis",level:"A2-B1",prompt:"Vous envisagez de partir en week-end avec vos amis le mois prochain. Rédigez un message pour leur présenter votre projet, incluant le lieu, les moyens de transport et les activités prévues. (60–80 mots)"},
  {id:5,task:"tache1",theme:"🎉 Invitations & événements",title:"Week-end sportif",level:"A2-B1",prompt:"Envoyez un message à vos amis pour les inviter à passer un week-end chez vous et pratiquer ensemble des activités sportives. (60–80 mots)"},
  {id:6,task:"tache1",theme:"🎉 Invitations & événements",title:"Cadeaux d'anniversaire",level:"A2-B1",prompt:"Votre anniversaire approche. Vos amis vous posent des questions sur les cadeaux que vous voulez. Vous répondez par un message en expliquant que vous aimeriez recevoir des vêtements et vous donnez les détails. (60–80 mots)"},
  {id:7,task:"tache1",theme:"🏡 Logement & colocation",title:"Chercher un colocataire",level:"A2-B1",prompt:"Vous êtes locataire d'un appartement trop grand pour vous et souhaitez trouver un colocataire. Rédigez une annonce pour présenter votre logement. (60–80 mots)"},
  {id:8,task:"tache1",theme:"🏡 Logement & colocation",title:"Annonce colocation",level:"A2-B1",prompt:"Vous occupez un grand appartement et recherchez un colocataire. Racontez la manière dont vous imaginez la colocation et présentez les particularités de votre logement. (60–80 mots)"},
  {id:9,task:"tache1",theme:"🏡 Logement & colocation",title:"Déménagement — infos à un ami",level:"A2-B1",prompt:"Vous avez trouvé un appartement intéressant et comptez déménager. Informez un ami par écrit en lui donnant tous les détails essentiels (type de logement, localisation et prix). (60–80 mots)"},
  {id:10,task:"tache1",theme:"🏡 Logement & colocation",title:"Demander de l'aide pour un logement",level:"A2-B1",prompt:"Rédigez un courriel à votre ami francophone afin de solliciter son soutien pour trouver un logement. Pensez à préciser les informations essentielles : genre de logement, budget, date. (60–80 mots)"},
  {id:11,task:"tache1",theme:"🏡 Logement & colocation",title:"Agence immobilière à Nice",level:"A2-B1",prompt:"Vous prévoyez d'habiter à Nice. Rédigez un message à une agence immobilière pour rechercher un appartement ou une maison (superficie, prix, localisation, chambres…). (60–80 mots)"},
  {id:12,task:"tache1",theme:"🚇 Transport & informations pratiques",title:"Transports pour Mehdi",level:"A2-B1",prompt:"Votre ami Mehdi vient de s'installer dans votre ville et cherche des informations sur les moyens de transport disponibles. Informez-le des transports, abonnements et tarifs en ville. (60–80 mots)"},
  {id:13,task:"tache1",theme:"🚇 Transport & informations pratiques",title:"Transports pour Anna",level:"A2-B1",prompt:"Votre amie Anna prévoit de passer un week-end dans votre ville et souhaite des informations sur les transports pour explorer les environs. Répondez-lui par message. (60–80 mots)"},
  {id:14,task:"tache1",theme:"🚇 Transport & informations pratiques",title:"Château de Chombony — itinéraire",level:"A2-B1",prompt:"Votre ami Cédric est invité à votre mariage qui se déroulera au Château de Chombony, mais il ne connaît pas cet endroit. Expliquez-lui comment s'y rendre. (60–80 mots)"},
  {id:15,task:"tache1",theme:"🍽️ Sorties & loisirs",title:"Pique-nique avec Léa",level:"A2-B1",prompt:"Votre amie Léa vous invite à un pique-nique et vous demande si vous connaissez un endroit agréable où l'organiser. Acceptez et proposez un lieu en décrivant les activités possibles. (60–80 mots)"},
  {id:16,task:"tache1",theme:"🍽️ Sorties & loisirs",title:"Déjeuner en plein air",level:"A2-B1",prompt:"Votre amie Barbara souhaite déjeuner en plein air ce week-end et vous demande des suggestions. Proposez-lui un endroit agréable. (60–80 mots)"},
  {id:17,task:"tache1",theme:"🍽️ Sorties & loisirs",title:"Exposition au musée",level:"A2-B1",prompt:"Vous êtes bénévole dans un musée de votre ville et souhaitez inviter vos amis à une exposition gratuite. Rédigez un message d'invitation. (60–80 mots)"},
  {id:18,task:"tache1",theme:"🍽️ Sorties & loisirs",title:"Mur d'art urbain",level:"A2-B1",prompt:"Un nouveau mur d'art urbain vient d'être inauguré dans votre quartier. Rédigez un message à votre ami pour lui en parler et lui proposer d'y aller ensemble. (60–80 mots)"},
  {id:19,task:"tache1",theme:"🍽️ Sorties & loisirs",title:"Site touristique entre amis",level:"A2-B1",prompt:"Invitez vos amis à explorer un site touristique. Mentionnez le lieu, les dates et les informations sur l'hébergement. (60–80 mots)"},
  {id:20,task:"tache1",theme:"💼 Travail & études",title:"Nouveau travail — annonce",level:"A2-B1",prompt:"Vous venez de décrocher un nouveau travail et souhaitez annoncer la nouvelle à votre amie francophone. Décrivez votre travail, vos collègues et votre environnement professionnel. (60–80 mots)"},
  {id:21,task:"tache1",theme:"💼 Travail & études",title:"Nouveau poste — horaires courts",level:"A2-B1",prompt:"Vous avez trouvé un nouveau poste avec des horaires plus courts. Rédigez un message à votre ami pour lui annoncer cette nouvelle et expliquer les avantages que cela apporte à votre quotidien. (60–80 mots)"},
  {id:22,task:"tache1",theme:"💼 Travail & études",title:"Satisfaction au travail",level:"A2-B1",prompt:"Votre ami Ali vous demande comment se passe votre nouveau travail et si vous en êtes satisfait(e). Répondez-lui par message. (60–80 mots)"},
  {id:23,task:"tache1",theme:"💼 Travail & études",title:"Télétravail — expérience",level:"A2-B1",prompt:"Vous travaillez depuis chez vous. Rédigez un message à un ami pour lui décrire votre expérience du télétravail. (60–80 mots)"},
  {id:24,task:"tache1",theme:"💼 Travail & études",title:"Nouvelle université",level:"A2-B1",prompt:"Vous avez reçu un message d'un ami Alex qui vous demande des nouvelles de votre nouvelle université. Vous lui répondez en décrivant brièvement votre environnement universitaire. (60–80 mots)"},
  {id:25,task:"tache1",theme:"💼 Travail & études",title:"Partenaire linguistique",level:"A2-B1",prompt:"Vous avez découvert une plateforme en ligne mettant en relation des personnes souhaitant apprendre le français avec des partenaires linguistiques. Rédigez un message à un ami pour lui en parler. (60–80 mots)"},
  {id:26,task:"tache1",theme:"💼 Travail & études",title:"Annonce partenaire sportif",level:"A2-B1",prompt:"Rédigez une annonce pour le journal de votre université afin de trouver un partenaire avec qui pratiquer une activité sportive. (60–80 mots)"},
  {id:27,task:"tache1",theme:"👪 Famille & vie quotidienne",title:"Grand-père seul",level:"A2-B1",prompt:"Votre grand-père ne peut plus vivre seul. Écrivez à vos parents pour leur proposer une solution adaptée. (60–80 mots)"},
  {id:28,task:"tache1",theme:"👪 Famille & vie quotidienne",title:"Conseils pour un CV",level:"A2-B1",prompt:"Vous aidez un ami à rédiger son CV et il hésite à y mettre sa photo. Donnez-lui votre avis et vos conseils. (60–80 mots)"},
  {id:29,task:"tache1",theme:"🏙️ Vie en ville & intégration",title:"Nouvelle vie en ville",level:"A2-B1",prompt:"Vous habitez dans une nouvelle ville depuis un mois. Écrivez un message à votre ami Léo pour lui raconter comment se passe votre nouvelle vie : votre appartement, votre quartier, la ville en général et ce que vous aimez y faire. (60–80 mots)"},
  {id:30,task:"tache1",theme:"🏙️ Vie en ville & intégration",title:"Article journal 'Bienvenue'",level:"A2-B1",prompt:"Le journal « Bienvenue » souhaite publier un article sur les nouveaux habitants de la ville. Rédigez un message dans lequel vous vous présentez et décrivez vos endroits favoris dans la ville. (60–80 mots)"},
  {id:31,task:"tache1",theme:"📱 Médias & société",title:"Publicités et enfants",level:"A2-B1",prompt:"Vous écrivez à votre cousin pour lui parler des publicités que ses enfants regardent. Donnez votre avis sur ce sujet. (60–80 mots)"},
  {id:32,task:"tache1",theme:"📱 Médias & société",title:"Expérience réseau social",level:"A2-B1",prompt:"Écrivez à un ami pour lui parler de votre expérience sur un réseau social. Décrivez ce que vous y faites et votre opinion. (60–80 mots)"},
  // ── TÂCHE 2 ──────────────────────────────────────────────────────────────
  // 1. VOYAGE / ÉTRANGER / INTÉGRATION 🌍
  {id:33,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Étudier à l'étranger – témoignages (forum)",level:"B1-B2",prompt:"Une étudiante de 19 ans souhaite partir à l'étranger pour ses études et demande des témoignages sur un forum. Julie, une étudiante de 19 ans, s'apprête à partir à l'étranger pour poursuivre ses études et recherche des témoignages. Rédigez votre témoignage sur ce forum. (120–150 mots)"},
  {id:34,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Étudier à l'étranger – partager son expérience",level:"B1-B2",prompt:"Une étudiante de 19 ans souhaite partir à l'étranger pour ses études et demande des témoignages sur un forum. Vous répondez en partageant votre propre expérience d'un séjour à l'étranger, en expliquant les défis et les bénéfices que vous en avez tirés. (120–150 mots)"},
  {id:51,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Premières impressions dans un pays étranger",level:"B1-B2",prompt:"Vous avez récemment déménagé dans un pays étranger et souhaitez partager vos premières impressions. Rédigez un texte (blog, forum ou message) pour décrire votre nouvelle vie, ce qui vous a surpris, ce qui vous plaît et ce qui vous manque. (120–150 mots)"},
  {id:52,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Vacances à l'étranger – partager son expérience",level:"B1-B2",prompt:"Vous avez visité un pays étranger pendant vos vacances et souhaitez partager votre expérience. Rédigez un article de blog ou un message sur un forum pour raconter ce voyage : les lieux visités, les rencontres, les découvertes culturelles. (120–150 mots)"},
  {id:53,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Dernières vacances – nouveau pays",level:"B1-B2",prompt:"Lors de vos dernières vacances, vous avez visité un nouveau pays. Rédigez un texte pour partager cette expérience avec vos amis ou vos lecteurs : décrivez ce pays, ce qui vous a marqué et ce que vous recommanderiez. (120–150 mots)"},
  {id:54,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Aaron et Perla visitent votre pays",level:"B1-B2",prompt:"Aaron et Perla prévoient de visiter votre pays pendant leurs vacances. Écrivez-leur un message pour leur présenter votre pays : les lieux incontournables, la culture, la cuisine et vos conseils pratiques pour bien préparer leur séjour. (120–150 mots)"},
  {id:55,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Impressions d'un voyage en solo",level:"B1-B2",prompt:"Publiez sur un forum vos impressions après un voyage seul. Racontez comment vous avez vécu cette expérience : les moments forts, les difficultés rencontrées et ce que vous en avez appris sur vous-même. (120–150 mots)"},
  {id:56,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Fête traditionnelle – article de blog",level:"B1-B2",prompt:"Vous avez participé à une fête traditionnelle dans votre pays ou à l'étranger. Parlez-en dans votre blog et expliquez pourquoi elle vous a plu : l'ambiance, les traditions, les activités et les émotions que vous avez ressenties. (120–150 mots)"},
  {id:57,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Partir un an pour voyager – opinion",level:"B1-B2",prompt:"Donnez votre avis sur « Partir un an pour voyager : conseillé ou risqué ? ». Participez à la discussion sur le site « voyage.internaute.fr » en répondant à la question : Est-ce une bonne ou une mauvaise idée de tout quitter pour voyager pendant un an ? Partagez votre point de vue en vous appuyant sur des exemples tirés de votre propre expérience. (120–150 mots)"},
  {id:58,task:"tache2",theme:"🌍 Voyage / Étranger / Intégration",title:"Quitter la ville pour la campagne – blog",level:"B1-B2",prompt:"Sur votre blog, expliquez les raisons qui vous ont poussé à quitter la ville pour vous installer à la campagne. Présentez les avantages de votre nouvelle vie rurale et décrivez comment votre quotidien a changé. (120–150 mots)"},

  // 2. LANGUES / APPRENTISSAGE 📚
  {id:59,task:"tache2",theme:"📚 Langues / Apprentissage",title:"Apprendre une langue étrangère – forum (1)",level:"B1-B2",prompt:"Sur un forum en ligne, partagez votre expérience d'apprentissage d'une langue étrangère. Racontez comment vous avez commencé, les méthodes que vous avez utilisées, les difficultés rencontrées et les progrès que vous avez réalisés. (120–150 mots)"},
  {id:60,task:"tache2",theme:"📚 Langues / Apprentissage",title:"Apprendre une langue étrangère – forum (2)",level:"B1-B2",prompt:"Sur un forum en ligne, partagez votre expérience de l'apprentissage d'une langue étrangère. Décrivez ce qui vous a motivé, les stratégies qui ont fonctionné pour vous et les conseils que vous donneriez à quelqu'un qui commence. (120–150 mots)"},
  {id:61,task:"tache2",theme:"📚 Langues / Apprentissage",title:"Apprendre une langue étrangère – forum (3)",level:"B1-B2",prompt:"Partagez votre expérience d'apprentissage d'une langue étrangère sur un forum. Expliquez pourquoi vous avez choisi cette langue, comment vous l'avez apprise et en quoi cette compétence a changé votre vie. (120–150 mots)"},

  // 3. FÊTES / ÉVÉNEMENTS / LOISIRS 🎉
  {id:62,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Fête de quartier entre voisins (1)",level:"B1-B2",prompt:"Vous avez récemment assisté à une fête de quartier entre voisins. Rédigez un article de blog ou un message pour décrire cet événement : l'ambiance, les activités, les rencontres et ce que vous avez apprécié. (120–150 mots)"},
  {id:63,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Fête de quartier entre voisins (2)",level:"B1-B2",prompt:"Vous avez récemment assisté à une fête de quartier entre voisins. Racontez cette expérience sur un forum ou dans un message à un ami : qu'est-ce qui vous a plu, qu'est-ce qui aurait pu être mieux organisé et recommanderiez-vous ce type d'événement ? (120–150 mots)"},
  {id:64,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Fête de famille",level:"B1-B2",prompt:"Vous avez récemment assisté à une fête de famille. Écrivez un texte pour raconter cet événement : qui était présent, ce que vous avez fait, les moments mémorables et les émotions que vous avez vécues. (120–150 mots)"},
  {id:65,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Mauvaise expérience lors d'un festival",level:"B1-B2",prompt:"Racontez une mauvaise expérience lors d'un festival. Écrivez un message sur un forum ou un article de blog pour décrire ce qui s'est passé, expliquer votre déception et donner votre avis sur l'organisation de l'événement. (120–150 mots)"},
  {id:66,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Festival de musique gratuit – article de blog",level:"B1-B2",prompt:"Vous avez assisté avec un ami à un festival de musique gratuit organisé dans votre ville. Écrivez un article de blog pour partager votre expérience et vos impressions : l'ambiance, les artistes, les moments forts et ce que vous recommanderiez. (120–150 mots)"},
  {id:67,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Spectacle de théâtre – article de blog",level:"B1-B2",prompt:"Une compagnie de théâtre est venue dans votre ville et vous avez assisté à l'une de ses représentations. Écrivez un article de blog pour raconter cette expérience : la pièce, les acteurs, vos impressions et si vous la recommanderiez. (120–150 mots)"},
  {id:68,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Concert incroyable – inviter ses amis",level:"B1-B2",prompt:"Vous avez assisté à un concert incroyable. Écrivez un article pour raconter ce que vous avez vécu et invitez vos amis à découvrir cet artiste en live : décrivez l'ambiance, la performance et pourquoi cela vaut le déplacement. (120–150 mots)"},
  {id:69,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Nouveau loisir – blog",level:"B1-B2",prompt:"Vous venez de commencer un nouveau loisir (sport, danse, etc.) et souhaitez en parler sur votre blog. Expliquez pourquoi vous avez choisi cette activité, comment se déroulent vos séances et ce que cette nouvelle passion vous apporte. (120–150 mots)"},
  {id:70,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Cours de sport en salle de fitness",level:"B1-B2",prompt:"Vous avez récemment participé à un cours de sport dans une salle de fitness. Rédigez un texte pour partager cette expérience : l'ambiance, le type de cours, le ressenti pendant et après la séance, et si vous le recommanderiez. (120–150 mots)"},
  {id:71,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Compétition sportive – partager son expérience",level:"B1-B2",prompt:"Vous avez participé à une compétition sportive et souhaitez partager votre expérience sur un site internet. Racontez comment vous vous êtes préparé(e), comment s'est déroulée la compétition et ce que vous en avez retenu. (120–150 mots)"},
  {id:72,task:"tache2",theme:"🎉 Fêtes / Événements / Loisirs",title:"Brocante dans votre ville",level:"B1-B2",prompt:"Vous avez pris part à une brocante dans votre ville, où vous avez vendu ou acheté des objets d'occasion. Rédigez un texte pour raconter cette expérience : l'ambiance, les objets que vous y avez trouvés et ce que vous avez apprécié ou non. (120–150 mots)"},

  // 4. SOCIÉTÉ / OPINION 💬
  {id:73,task:"tache2",theme:"💬 Société / Opinion",title:"Travailler moins pour vivre mieux – forum",level:"B1-B2",prompt:"Rédigez un article pour un forum sur le thème : « Travailler moins pour vivre mieux ». Donnez votre opinion et justifiez votre point de vue avec des arguments et des exemples tirés de votre expérience ou de votre observation. (120–150 mots)"},
  {id:74,task:"tache2",theme:"💬 Société / Opinion",title:"Télétravail et productivité – site professionnel",level:"B1-B2",prompt:"Sur un site professionnel, rédigez un article sur les effets du télétravail sur la productivité. Présentez les avantages et les inconvénients que vous avez observés et donnez votre point de vue personnel. (120–150 mots)"},
  {id:75,task:"tache2",theme:"💬 Société / Opinion",title:"La photo sur le CV – forum recrutement",level:"B1-B2",prompt:"Participez à un forum de recrutement pour donner votre opinion sur la présence de la photo sur le CV. Êtes-vous pour ou contre ? Justifiez votre position avec des arguments clairs. (120–150 mots)"},
  {id:76,task:"tache2",theme:"💬 Société / Opinion",title:"Réseaux sociaux – influence sur la vie quotidienne",level:"B1-B2",prompt:"Donnez votre avis sur l'influence des réseaux sociaux dans la vie quotidienne. Rédigez un texte pour un forum ou un blog en présentant les effets positifs et négatifs que vous avez constatés. (120–150 mots)"},
  {id:77,task:"tache2",theme:"💬 Société / Opinion",title:"Arrêter son réseau social préféré",level:"B1-B2",prompt:"Vous avez décidé d'arrêter d'utiliser votre réseau social préféré (comme Instagram, Facebook, etc.). Dans un texte adressé à vos amis ou vos lecteurs, vous racontez cette expérience : pourquoi vous avez pris cette décision, comment vous vous sentez et ce que cela a changé. (120–150 mots)"},
  {id:78,task:"tache2",theme:"💬 Société / Opinion",title:"Publicité destinée aux enfants",level:"B1-B2",prompt:"Donnez votre opinion sur la publicité destinée aux enfants. Rédigez un texte pour un forum ou un article de blog : présentez vos arguments et expliquez si vous pensez que cette pratique devrait être encadrée ou interdite. (120–150 mots)"},
  {id:79,task:"tache2",theme:"💬 Société / Opinion",title:"Gratuité des musées – blog",level:"B1-B2",prompt:"Rédigez un article sur votre blog pour donner votre avis sur la gratuité des musées. Êtes-vous pour ou contre ? Justifiez votre position avec des arguments et des exemples concrets. (120–150 mots)"},
  {id:80,task:"tache2",theme:"💬 Société / Opinion",title:"Street art dans votre ville – site culturel",level:"B1-B2",prompt:"Écrivez un article pour un site culturel sur la place du street art dans votre ville. Décrivez ce phénomène, partagez votre opinion et expliquez si vous pensez que le street art embelli ou dégrade l'espace public. (120–150 mots)"},
  {id:81,task:"tache2",theme:"💬 Société / Opinion",title:"Admiration pour une personnalité (1)",level:"B1-B2",prompt:"Exprimez votre admiration pour une personnalité (célèbre ou non). Rédigez un texte pour un forum ou un blog : présentez cette personne, expliquez ce que vous admirez en elle et pourquoi elle vous inspire. (120–150 mots)"},
  {id:82,task:"tache2",theme:"💬 Société / Opinion",title:"Admiration pour une personnalité – blog (2)",level:"B1-B2",prompt:"Rédigez un article de blog pour exprimer votre admiration envers une personne. Qui est-elle ? Qu'a-t-elle accompli ? En quoi son parcours ou ses valeurs vous touchent-ils particulièrement ? (120–150 mots)"},

  // 5. FAMILLE / RELATIONS / SOLIDARITÉ 👨‍👩‍👧
  {id:83,task:"tache2",theme:"👨‍👩‍👧 Famille / Relations / Solidarité",title:"Association de quartier – activités enfants (1)",level:"B1-B2",prompt:"Vous êtes membre d'une association de quartier qui propose des activités aux enfants. Rédigez un article ou un message pour présenter l'association, décrire les activités proposées et expliquer pourquoi vous vous y impliquez. (120–150 mots)"},
  {id:84,task:"tache2",theme:"👨‍👩‍👧 Famille / Relations / Solidarité",title:"Association de quartier – activités enfants (2)",level:"B1-B2",prompt:"Vous faites partie d'une association qui organise diverses activités pour les enfants du quartier. Écrivez un texte pour un site communautaire ou un forum afin de présenter ces activités et d'inviter d'autres personnes à rejoindre l'association. (120–150 mots)"},
  {id:85,task:"tache2",theme:"👨‍👩‍👧 Famille / Relations / Solidarité",title:"Cohabitation avec une personne âgée",level:"B1-B2",prompt:"Le site « Infos Familles » recherche des témoignages sur la cohabitation avec une personne âgée. Rédigez votre témoignage : décrivez votre expérience, les défis que vous avez rencontrés et ce que cette cohabitation vous a apporté. (120–150 mots)"},
  {id:86,task:"tache2",theme:"👨‍👩‍👧 Famille / Relations / Solidarité",title:"S'occuper des personnes âgées – forum",level:"B1-B2",prompt:"Partagez votre avis sur un forum sur les différentes façons de s'occuper des personnes âgées. Quelles solutions existent ? Laquelle vous semble la meilleure et pourquoi ? Appuyez-vous sur votre expérience ou vos observations. (120–150 mots)"},
  {id:87,task:"tache2",theme:"👨‍👩‍👧 Famille / Relations / Solidarité",title:"Expérience de colocation – blog",level:"B1-B2",prompt:"Décrivez votre expérience de colocation sur un blog. Racontez comment vous avez trouvé vos colocataires, comment se passe la vie ensemble, les avantages et les inconvénients de ce mode de vie. (120–150 mots)"},

  // 6. ALIMENTATION / SANTÉ 🥗
  {id:88,task:"tache2",theme:"🥗 Alimentation / Santé",title:"Modifier son alimentation – forum",level:"B1-B2",prompt:"Rédigez un article sur un forum pour expliquer les raisons qui vous ont poussé à modifier votre manière de vous alimenter. Qu'est-ce qui a changé dans votre alimentation ? Quels effets avez-vous constatés sur votre santé et votre bien-être ? (120–150 mots)"},
  {id:89,task:"tache2",theme:"🥗 Alimentation / Santé",title:"Habitudes alimentaires de votre pays – appel à témoignages",level:"B1-B2",prompt:"Le site www.manger-international.com lance un appel à témoignages. Ce mois-ci, il veut découvrir les habitudes alimentaires dans différents pays. Vous écrivez un article pour parler de celles de votre pays. Dites ce que vous appréciez ou non dans ces habitudes et expliquez pourquoi. (120–150 mots)"},

  // 7. ÉTUDES / UNIVERSITÉ 🎓
  {id:90,task:"tache2",theme:"🎓 Études / Université",title:"Journée d'accueil – courriel aux nouveaux étudiants",level:"B1-B2",prompt:"Votre établissement vous a confié la mission d'organiser une journée d'accueil pour les nouveaux étudiants francophones. Écrivez un courriel à leur intention en précisant toutes les informations utiles pour le bon déroulement de cette rencontre : programme, lieu, horaires et conseils pratiques. (120–150 mots)"},
  {id:35,task:"tache3",theme:"🌍 Environnement & transport",title:"L'interdiction des voitures en ville",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'interdiction des voitures dans les centres urbains. (120–180 mots)

📄 Document 1 : Face à des niveaux de pollution très élevés, certaines villes ont décidé d'interdire la circulation des voitures dans les centres urbains. Oslo a récemment choisi cette mesure et en tire un bilan positif. Avec le temps, les accidents diminueront, la consommation de pétrole reculera et la qualité de l'air s'améliorera.

📄 Document 2 : De nombreuses villes lancent des projets d'interdiction sans disposer des moyens indispensables. Certes, la réduction des voitures diminue la pollution, mais il est nécessaire de prévoir de grands parkings, de développer les transports en commun et d'accorder des autorisations spéciales à certains professionnels (police, services d'urgence, livreurs).`},

  {id:36,task:"tache3",theme:"🌍 Environnement & transport",title:"Transports en commun : bénéfices et contraintes",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la gratuité des transports en commun. (120–180 mots)

📄 Document 1 : La gratuité des transports en commun est une initiative très positive. Elle permet de réduire le trafic automobile et de limiter les bouchons. Dans les villes où les transports sont gratuits, on constate une hausse de leur utilisation et une amélioration du commerce local.

📄 Document 2 : Cette mesure n'est pas appropriée. La gratuité des transports représente un coût élevé pour les villes. Il vaudrait mieux améliorer la desserte des transports publics plutôt que de les rendre gratuits. Garder les transports payants encourage aussi les usagers à mieux respecter les installations.`},

  {id:37,task:"tache3",theme:"🌍 Environnement & transport",title:"Les vols low-cost : avantages et limites",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les vols à bas prix. (120–180 mots)

📄 Document 1 : Je voyage souvent avec des compagnies aériennes à petit prix. Les low-cost proposent des billets bien moins chers, parfois moins chers que le train. Mais avec ces tarifs, aucun service n'est inclus à bord. Ce type de vol n'est donc pas adapté aux longs trajets.

📄 Document 2 : J'ai décidé d'arrêter les compagnies low-cost. Les sièges sont inconfortables, les employés travaillent dans des conditions difficiles et les avions semblent parfois trop vieux pour garantir une bonne sécurité. Je préfère désormais la voiture, le train ou une compagnie classique.`},

  {id:38,task:"tache3",theme:"🌍 Environnement & transport",title:"Interdiction de la circulation en zones urbaines",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'interdiction de circuler en centre-ville. (120–180 mots)

📄 Document 1 : Face à une pollution croissante, certaines villes ont mis en place des interdictions de circulation. Oslo a appliqué cette mesure avec succès, réduisant le taux d'accidents et la dépendance au pétrole, tout en améliorant la qualité de l'air.

📄 Document 2 : Si l'interdiction des voitures a des avantages, elle pose aussi des défis. Beaucoup de villes ne disposent pas encore d'une infrastructure adaptée. Il est essentiel de prévoir des parkings, de renforcer les transports en commun et de permettre la circulation des services essentiels.`},

  {id:39,task:"tache3",theme:"🌍 Environnement & transport",title:"Les billets d'avion à prix réduits",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les compagnies aériennes à bas prix. (120–180 mots)

📄 Document 1 : Je privilégie souvent les compagnies à bas prix. Elles proposent des tarifs bien inférieurs aux compagnies traditionnelles, parfois même plus avantageux que le train ou la voiture. Cependant, ces prix impliquent l'absence totale de services à bord.

📄 Document 2 : Après réflexion, j'ai choisi de ne plus voyager avec les compagnies à bas prix. Les sièges sont trop inconfortables, les conditions de travail du personnel sont préoccupantes et la sécurité des avions laisse parfois à désirer. Je privilégierai la voiture ou le train.`},

  {id:40,task:"tache3",theme:"🌍 Environnement & transport",title:"Les vols à bas prix : pour ou contre ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les compagnies low-cost. (120–180 mots)

📄 Document 1 : Je voyage fréquemment avec des compagnies aériennes à bas prix. Ces compagnies proposent des billets bien moins chers que les compagnies classiques, parfois plus économiques que le train ou la voiture. Évidemment, les services à bord sont inexistants : pas de repas ni de boissons.

📄 Document 2 : J'ai décidé de ne plus emprunter les compagnies low-cost. Ce choix s'impose face à l'inconfort des sièges, aux conditions de travail difficiles et aux doutes sur la sécurité liés à la vétusté des avions. Je privilégierai donc la voiture ou le train pour certains trajets.`},

  {id:41,task:"tache3",theme:"🌍 Environnement & transport",title:"Le cyclisme urbain",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'utilisation du vélo en ville. (120–180 mots)

📄 Document 1 : Le vélo constitue avant tout un moyen de déplacement quotidien. En milieu urbain, il se révèle rapide et apaisant, offrant une échappatoire au trafic aux heures de pointe. Une solution idéale pour allier activité physique et déplacements utiles.

📄 Document 2 : Circuler à vélo en milieu urbain comporte des risques non négligeables. La concentration élevée de véhicules, les manquements aux règles de circulation et l'insuffisance des pistes cyclables créent un environnement dangereux. À ces dangers s'ajoute l'exposition quotidienne aux polluants atmosphériques.`},

  {id:42,task:"tache3",theme:"🌍 Environnement & transport",title:"Villes et environnement : impacts et réalités",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'impact des villes sur l'environnement. (120–180 mots)

📄 Document 1 : De nos jours, les villes s'agrandissent sans cesse, ce qui affecte l'environnement. La déforestation est l'un des impacts les plus visibles. Les arbres retiennent le carbone : quand ils sont abattus pour construire des immeubles ou des routes, on détruit des zones importantes.

📄 Document 2 : Plus de la moitié des habitants de la planète vivent en ville. On affirme souvent que les villes ne respectent pas l'environnement, mais il faut relativiser : elles ne sont pas toujours aussi polluantes qu'on l'imagine. Un habitant de la ville consomme souvent moins d'énergie qu'une personne à la campagne.`},

  {id:43,task:"tache3",theme:"🌍 Environnement & transport",title:"L'agrandissement des villes",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la croissance urbaine et ses conséquences environnementales. (120–180 mots)

📄 Document 1 : Les villes continuent de croître rapidement, entraînant de graves répercussions sur l'environnement. La déforestation est l'un des impacts les plus alarmants : les plantes jouent un rôle crucial dans l'absorption du carbone, et la construction urbaine remplace souvent ces espaces verts.

📄 Document 2 : La majorité de la population mondiale vit aujourd'hui en zone urbaine. On affirme souvent que les villes amplifient les problèmes environnementaux, mais il convient de relativiser. La consommation d'énergie d'un citadin est souvent inférieure à celle d'un habitant de la campagne.`},

  {id:44,task:"tache3",theme:"🌍 Environnement & transport",title:"Ville ou campagne : deux modes de vie",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur votre préférence entre la vie en ville et la vie à la campagne. (120–180 mots)

📄 Document 1 : Vivre en ville permet de profiter de nombreuses activités de loisirs. Aller au cinéma, dîner au restaurant ou faire les magasins est très facile. La ville offre également une grande variété d'activités culturelles comme les musées, le théâtre ou l'opéra.

📄 Document 2 : J'ai choisi de m'installer à la campagne car je voulais vivre dans un environnement plus naturel et tranquille. Le prix des logements a été un élément important : à la campagne, les maisons coûtent beaucoup moins cher. Avec le même budget, j'ai pu acheter une grande maison avec jardin.`},

  {id:45,task:"tache3",theme:"🌍 Environnement & transport",title:"Ville ou campagne : choisir son cadre de vie",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le choix entre vie urbaine et vie rurale. (120–180 mots)

📄 Document 1 — Marie, 42 ans : Depuis que j'ai déménagé à la campagne, ma vie a complètement changé. J'ai fui le bruit, la pollution et la foule pour profiter du calme et des espaces verts. Je savoure la tranquillité et de grands espaces sans voisins proches.

📄 Document 2 — Claire, 35 ans : La vie rurale n'est pas adaptée à tous. Les commerces, loisirs et services essentiels peuvent se trouver à plusieurs kilomètres. Il est souvent nécessaire d'utiliser la voiture, et Internet n'est pas toujours fiable. La ville procure un confort quotidien supérieur.`},

  {id:46,task:"tache3",theme:"🌍 Environnement & transport",title:"L'utilisation du plastique",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'utilisation du plastique dans notre société. (120–180 mots)

📄 Document 1 — Franck : Il défend une utilisation restreinte du plastique, soulignant son importance dans des domaines tels que l'alimentation et la médecine. Il prône une gestion responsable et le recyclage, tout en admettant que certains usages sont inévitables dans la société moderne.

📄 Document 2 — Amicha : Elle s'oppose fermement à l'utilisation du plastique en raison de ses impacts environnementaux dévastateurs : pollution des océans et destruction des écosystèmes. Selon elle, il est urgent d'adopter des alternatives écologiques et durables.`},

  {id:47,task:"tache3",theme:"🍔 Alimentation & consommation",title:"La question de la consommation de viande",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la consommation de viande. (120–180 mots)

📄 Document 1 — Daniel : Je suis opposé à la consommation de viande. D'un point de vue éthique, tous les animaux méritent de vivre librement. Sur le plan environnemental, la production de viande génère une grande quantité de gaz à effet de serre et consomme d'énormes ressources en terres et en eau.

📄 Document 2 — Alain : Je pense que la consommation de viande reste justifiée, car elle fournit des nutriments essentiels comme les protéines, les vitamines B, le fer et le zinc. La viande joue aussi un rôle clé dans de nombreuses cultures et traditions culinaires.`},

  {id:48,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Végétarisme : un choix à réfléchir",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le végétarisme. (120–180 mots)

📄 Document 1 : Le végétarisme offre plusieurs bénéfices. Il contribue à une meilleure santé en réduisant les risques de maladies cardiaques. Il joue aussi un rôle dans la protection de l'environnement en réduisant la pollution liée à la production de viande. Enfin, il permet de respecter les animaux.

📄 Document 2 : Le végétarisme ne convient pas à tout le monde. Certaines personnes ont besoin de viande pour obtenir des nutriments essentiels comme le fer et les protéines. De plus, les habitudes alimentaires traditionnelles incluent souvent la viande, ce qui rend ce changement difficile.`},

  {id:49,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Art urbain ou vandalisme ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les graffitis dans les villes. (120–180 mots)

📄 Document 1 : Dans les grandes villes, on voit de plus en plus de peintures sur les façades des bâtiments. Cet art de rue permet à la culture d'être présente dans l'espace public. Pour certains maires, il est essentiel de donner aux artistes des espaces légaux. Ces graffitis attirent aussi les touristes.

📄 Document 2 : Chaque année, certaines villes investissent des sommes importantes pour lutter contre les graffitis. Les dessins sur les murs sont difficiles à enlever. Pour certains habitants, ces peintures nuisent à l'image de leur quartier et dérangent les propriétaires, obligés de les nettoyer eux-mêmes.`},

  {id:50,task:"tache3",theme:"🍔 Alimentation & consommation",title:"L'art urbain : pour ou contre ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'art de rue dans les villes. (120–180 mots)

📄 Document 1 : L'art éveille la curiosité des citadins et transforme l'espace urbain en un lieu d'échange entre artistes et passants. Peintures et spectacles de rue créent une atmosphère immersive, rendant l'art accessible à tous et embellissant la ville.

📄 Document 2 : À plus grande échelle, les graffitis divisent l'opinion. Perçus par certains comme une forme de vandalisme défigurant l'espace public, ils sont associés à une rupture sociale et à une pollution visuelle. Ce débat opposant artistes, législateurs et citoyens reste vif.`},

  {id:51,task:"tache3",theme:"🍔 Alimentation & consommation",title:"La restauration rapide",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la restauration rapide. (120–180 mots)

📄 Document 1 — Catherine : « Je suis complètement contre les chaînes de fast-food. La qualité de la nourriture y est faible et manger ce type d'aliments peut provoquer des maladies. Certes, les hamburgers et frites sont pratiques et bon marché, mais il est important de faire d'autres choix pour rester en bonne santé. »

📄 Document 2 — Bernard : « Je soutiens la restauration rapide. On peut y trouver des repas équilibrés avec des légumes, des salades, du pain et de la viande. Chaque client est responsable de ce qu'il mange. Ces restaurants sont aussi très propres et faciles d'accès pour les familles. »`},

  {id:52,task:"tache3",theme:"🍔 Alimentation & consommation",title:"La restauration express",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la restauration rapide et ses effets sur la santé. (120–180 mots)

📄 Document 1 : Les restaurants express offrent des plats variés, tout en respectant les normes d'hygiène et en proposant une gamme diversifiée de produits de qualité. De plus, c'est le client qui compose son menu, assumant ainsi la responsabilité de ses choix.

📄 Document 2 : La restauration express est nocive pour la santé, car elle engendre des problèmes irréversibles comme l'obésité. Une consommation régulière de ce type d'aliments peut avoir des conséquences graves sur la santé à long terme.`},

  {id:53,task:"tache3",theme:"🍔 Alimentation & consommation",title:"La livraison de repas au bureau",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la livraison de repas en entreprise. (120–180 mots)

📄 Document 1 — Céline, 25 ans : La livraison de repas représente un gain de temps appréciable. Il est possible de se faire livrer sur son lieu de travail, évitant ainsi de se déplacer. Ce service offre une grande variété de choix et est disponible 24h/24.

📄 Document 2 — Ahmed, 40 ans : Ce service a un impact environnemental non négligeable, les livraisons étant souvent effectuées en scooter ou en voiture polluants. Ce mode de consommation peut aussi nuire à la vie sociale en poussant les gens à rester à l'intérieur.`},

  {id:54,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Livraison des repas au bureau : pour ou contre ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la livraison de repas en milieu professionnel. (120–180 mots)

📄 Document 1 : La livraison de repas en entreprise offre un gain de temps considérable. Les employés n'ont plus besoin de quitter leur lieu de travail pour manger. Les repas étant directement disponibles, il est possible de les consommer après une réunion sans interrompre une tâche importante.

📄 Document 2 : Bien que pratique, ce service comporte des inconvénients. Avec la forte demande, les services de livraison peuvent être débordés, entraînant des retards. De plus, rester trop longtemps à son poste sans faire de pause peut entraîner une fatigue accrue et nuire au bien-être.`},

  {id:55,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Faire ses courses : grandes surfaces ou commerces de proximité ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur votre préférence entre supermarché et commerce de proximité. (120–180 mots)

📄 Document 1 : Faire ses courses au supermarché est avantageux : on y trouve une grande diversité de produits au même endroit. On peut passer d'un rayon à l'autre et profiter d'offres promotionnelles régulières sur plusieurs marques.

📄 Document 2 — Association pour la défense des commerces de proximité : L'initiative « Février sans supermarché » encourage à privilégier les épiceries de quartier. Les clients en retirent des avantages : des produits plus frais, de meilleure qualité, et des moments d'échange avec leurs voisins.`},

  {id:56,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Privilégier la ferme ou le supermarché ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur votre façon de faire vos courses. (120–180 mots)

📄 Document 1 : Je réalise mes achats alimentaires à moins de dix kilomètres de chez moi. Habitant à la campagne, j'achète directement à la ferme et discute avec les producteurs. Le prix est parfois plus élevé, mais les produits sont de meilleure qualité et je connais leur origine.

📄 Document 2 : Pour mes courses, je me rends toujours au supermarché. C'est plus pratique, surtout avec les enfants. Je peux trouver tous les produits au même endroit et profiter des promotions. L'important est de gagner du temps, de réduire mes dépenses et de faire mes courses près de chez moi.`},

  {id:57,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Les menus sans viande dans les cantines",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'introduction de menus sans viande dans les cantines scolaires. (120–180 mots)

📄 Document 1 : De plus en plus d'établissements scolaires intègrent des repas sans viande. Les enfants consomment une quantité excessive de protéines animales. Les écoles privilégient des alternatives comme le soja, les céréales et les légumes, qui sont plus sains et souvent plus économiques pour les familles.

📄 Document 2 : La suppression de la viande dans les menus scolaires ne fait pas l'unanimité. Pour certaines familles en difficulté, la cantine est la seule occasion pour leurs enfants de consommer de la viande. Par ailleurs, les producteurs locaux sont affectés, et de nombreux enfants préfèrent encore les plats à base de viande.`},

  {id:58,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Les distributeurs automatiques dans les écoles",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'installation de distributeurs automatiques dans les lycées. (120–180 mots)

📄 Document 1 : Certains estiment que les distributeurs automatiques dans les lycées sont un atout. Ils permettent aux élèves d'avoir un accès rapide à des boissons et en-cas. De plus, ces distributeurs peuvent être approvisionnés en options saines comme des jus de fruits et de l'eau.

📄 Document 2 : D'autres considèrent que ces distributeurs favorisent une consommation excessive de produits sucrés et contribuent à des problèmes de santé comme l'obésité et le diabète. Les écoles devraient encourager des habitudes alimentaires plus saines et éviter ces installations.`},

  {id:59,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Cuisiner pour le plaisir ou comme métier ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la cuisine amateur versus professionnelle. (120–180 mots)

📄 Document 1 : Les passionnés de cuisine arrivent à préparer quelques plats, mais ils manquent généralement des techniques et de l'expérience des chefs. Maîtriser l'art culinaire nécessite un apprentissage et une pratique approfondie.

📄 Document 2 : Grâce aux réseaux sociaux et aux cours en ligne, certains autodidactes se sont distingués. Le parcours d'une passionnée devenue cheffe et auteure de livres de cuisine démontre qu'il est possible de réussir autrement que par la voie classique.`},

  {id:60,task:"tache3",theme:"🍔 Alimentation & consommation",title:"Manger à l'extérieur ou chez soi ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur votre préférence entre manger au restaurant et manger à la maison. (120–180 mots)

📄 Document 1 — Aïcha, 28 ans : Elle préfère dîner à l'extérieur plutôt que de manger seule à la maison. Elle apprécie la possibilité de sortir à tout moment et de partager des repas conviviaux avec ses amis, ce qui est impossible dans son petit appartement.

📄 Document 2 — Laura, 45 ans : Manger au restaurant est souvent trop coûteux pour elle. Le budget familial l'empêche de sortir souvent. Elle préfère savoir exactement ce qu'elle mange en préparant les repas chez elle et critique la qualité des plats au restaurant.`},

  {id:61,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Parents exigeants ou permissifs ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le style parental à privilégier. (120–180 mots)

📄 Document 1 : J'ai 19 ans et je vis toujours avec mes parents. Même majeure, ils restent très exigeants. Avant mes 18 ans, je devais être à la maison avant 20 heures. Aujourd'hui, ma mère reste très inquiète et m'appelle souvent pour savoir où je suis.

📄 Document 2 : Certains parents laissent beaucoup de liberté à leurs enfants, craignant que trop de règles les rendent tristes. Cependant, des enfants élevés sans limites auront du mal à respecter les règles et à vivre en société une fois adultes.`},

  {id:62,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Sévérité parentale : atout ou frein ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'autorité parentale. (120–180 mots)

📄 Document 1 : À presque 22 ans, je vis encore chez mes parents et leur autorité reste omniprésente. Lorsque j'étais mineure, il m'était interdit de dormir ailleurs. Aujourd'hui, ma mère m'appelle constamment jusqu'à mon retour à la maison.

📄 Document 2 : Les parents redoutent parfois d'être trop stricts, craignant de freiner l'épanouissement de leurs enfants. Pourtant, céder à toutes leurs demandes peut aussi avoir des conséquences négatives. Il est essentiel d'inculquer dès l'enfance le respect de certaines règles nécessaires à la vie en société.`},

  {id:63,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Lecture et enfants : encourager sans forcer",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la façon d'encourager les enfants à lire. (120–180 mots)

📄 Document 1 : Obliger les enfants à lire n'est pas une bonne solution. Quand un enfant aime le sport, on ne le contraint pas, on essaie de le motiver. Il en va de même pour la lecture. La pédopsychiatre Laurence T. affirme que l'amour de la lecture ne peut pas être imposé.

📄 Document 2 : Lire avec ses enfants est une activité agréable et bénéfique. Une lecture régulière leur permet d'apprendre de nouveaux mots et de mieux écouter. Ce moment est idéal pour partager du plaisir en famille. Cinq à dix minutes par jour suffisent pour donner le goût de la lecture durablement.`},

  {id:64,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Les bienfaits de la lecture pour les jeunes",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'importance de la lecture pour les enfants à l'ère numérique. (120–180 mots)

📄 Document 1 : À l'ère du numérique, les jeux vidéo, les sports et les réseaux sociaux captivent les enfants bien plus que les livres. Faut-il leur imposer la lecture ? Comme le rappelle un proverbe, le goût de la lecture ne peut être forcé. Il faut leur laisser la liberté de choisir.

📄 Document 2 : La lecture a toujours été un héritage transmis de génération en génération. Lire régulièrement permet aux jeunes d'acquérir plus facilement le langage, tout en développant leur attention. Les parents peuvent accorder dix minutes par jour à la lecture avec leurs enfants, renforçant ainsi les liens familiaux.`},

  {id:65,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Technologies dans les écoles : pour ou contre ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'utilisation des nouvelles technologies dans les écoles. (120–180 mots)

📄 Document 1 — Adam : « Je suis persuadé que l'intégration des nouvelles technologies dans les écoles est essentielle pour préparer les élèves à l'avenir numérique. L'utilisation des tablettes et ordinateurs motive les élèves et favorise leur créativité et leur autonomie. »

📄 Document 2 — Inès : « Je reste dubitative face à l'utilisation excessive des technologies. Cela peut limiter les interactions humaines et entraîner une dépendance aux écrans. Les méthodes traditionnelles et le contact direct entre enseignants et élèves sont essentiels pour un développement équilibré. »`},

  {id:66,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Les nouvelles technologies à l'école : atout ou risque ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les technologies numériques en milieu scolaire. (120–180 mots)

📄 Document 1 — Jean : « Intégrer les nouvelles technologies dans l'éducation est indispensable pour préparer les élèves à l'ère du numérique. L'usage des tablettes et ordinateurs renforce leur motivation, enrichit leur apprentissage et favorise leur autonomie et leur créativité. »

📄 Document 2 — Sara : « L'usage excessif des technologies dans l'enseignement me laisse perplexe. Il pourrait nuire aux relations humaines et accentuer l'addiction aux écrans. L'enseignement traditionnel et le lien direct entre élèves et enseignants sont irremplaçables. »`},

  {id:67,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"L'usage des nouvelles technologies en milieu scolaire",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'introduction du numérique à l'école. (120–180 mots)

📄 Document 1 — Jean : « L'introduction des nouvelles technologies dans les écoles est indispensable pour familiariser les élèves avec l'univers numérique. L'usage des outils numériques renforce leur motivation et améliore leur apprentissage en leur offrant des ressources variées qui encouragent leur indépendance. »

📄 Document 2 — Sara : « Je suis partagée sur l'intégration poussée des technologies dans l'éducation. Cela pourrait nuire aux interactions sociales et accentuer une addiction aux écrans. L'enseignement traditionnel, basé sur un échange direct entre professeurs et élèves, demeure primordial. »`},

  {id:68,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Technologie et enfants",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'impact de la technologie sur les enfants. (120–180 mots)

📄 Document 1 : Les élèves du primaire peuvent utiliser la technologie pour chercher des vidéos liées à leurs leçons ou s'exercer avec des jeux qui développent leurs compétences en mathématiques, en lecture et en saisie au clavier.

📄 Document 2 : Les technologies poussent aujourd'hui les enfants à rester inactifs, ce qui inquiète beaucoup de parents. Elles limitent les jeux créatifs, les échanges sociaux directs et l'activité physique. Il faudrait encourager les enfants à poser leurs appareils et essayer des activités ludiques.`},

  {id:69,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Les enfants face aux nouvelles technologies",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'utilisation des technologies par les enfants. (120–180 mots)

📄 Document 1 : La technologie peut être utilisée par les enfants du primaire pour explorer des vidéos en lien avec leurs apprentissages scolaires ou pour s'exercer à travers des jeux qui développent leurs capacités en calcul, en lecture ou en écriture au clavier.

📄 Document 2 : Les technologies modernes encouragent une attitude passive chez les enfants, ce qui préoccupe beaucoup de parents. Elles limitent les interactions humaines, les jeux imaginatifs et l'exercice physique. Il faudrait introduire des activités originales et engageantes pour les aider à se déconnecter.`},

  {id:70,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Caméras de surveillance à l'école",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'installation de caméras de surveillance dans les écoles. (120–180 mots)

📄 Document 1 : À l'école où je travaille à Montréal, les caméras de surveillance sont largement présentes. Elles dissuadent les élèves de commettre des actes de violence. Les enseignants, les parents et la majorité des élèves les accueillent favorablement car elles renforcent la sécurité.

📄 Document 2 : Je m'oppose à l'installation de caméras de surveillance dans les écoles. Les résultats obtenus dans d'autres pays ne sont pas convaincants. Pour résoudre les problèmes de discipline, il est préférable d'améliorer la communication entre enseignants, administration et élèves.`},

  {id:71,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"L'uniforme scolaire",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le port de l'uniforme à l'école. (120–180 mots)

📄 Document 1 : Le port de l'uniforme peut limiter l'expression personnelle des élèves. Pour ceux qui souhaitent affirmer leur identité à travers leur style vestimentaire, l'uniforme impose une conformité qui peut les frustrer.

📄 Document 2 : Le port de l'uniforme favorise un sentiment d'appartenance à l'établissement et renforce la communauté. Il aide à réduire les discriminations liées au style vestimentaire ou à la classe sociale et offre un avantage économique pour les familles.`},

  {id:72,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Écoles privées ou publiques ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le choix entre école privée et école publique. (120–180 mots)

📄 Document 1 : Les écoles privées enregistrent une hausse constante d'inscriptions. Les parents apprécient la discipline et la proximité avec les enseignants. Cependant, leur coût élevé les rend moins accessibles, et elles accueillent majoritairement des élèves issus de milieux aisés.

📄 Document 2 : L'accès aux écoles privées reste limité aux familles pouvant assumer les coûts de scolarité. Cette séparation entre privé et public freine la mixité sociale et réduit les opportunités d'échanges entre jeunes de différentes origines, perpétuant ainsi les inégalités.`},

  {id:73,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Devoirs à domicile : bienfaits et critiques",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les devoirs à la maison. (120–180 mots)

📄 Document 1 : Les devoirs à domicile sont bénéfiques car ils permettent aux élèves de gérer leur temps seuls. Pour les parents, ils représentent une occasion de se rapprocher de l'école et de montrer de l'intérêt à leurs enfants, qui se sentent valorisés.

📄 Document 2 : Nous nous opposons aux devoirs à la maison. Leur efficacité pour améliorer les résultats scolaires n'a jamais été prouvée. De nombreux parents n'ont pas le temps ou les connaissances pour aider leurs enfants. Les élèves autonomes perdent du temps, et ceux qui ne sont pas aidés restent en difficulté.`},

  {id:74,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Les devoirs à domicile : atout ou contrainte ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'utilité des devoirs scolaires à la maison. (120–180 mots)

📄 Document 1 : Selon certains parents d'élèves, les devoirs sont bénéfiques, car ils enseignent aux enfants à organiser leur travail. Ils offrent aux familles un moment d'échange avec l'école. Ce suivi permet aux parents de montrer à leurs enfants qu'ils s'intéressent à leur progression.

📄 Document 2 : Nous remettons en question l'utilité des devoirs à domicile, car ils ne garantissent pas de meilleurs résultats scolaires. De nombreux parents ne peuvent pas superviser le travail de leurs enfants. Les élèves autonomes n'en ont pas besoin, et ceux qui ne sont pas aidés restent pénalisés.`},

  {id:75,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"L'enseignement à domicile",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la scolarisation à domicile. (120–180 mots)

📄 Document 1 : L'enseignement à domicile permet une approche pédagogique plus personnalisée. L'enfant peut gérer son apprentissage à son propre rythme, approfondir les sujets qui le passionnent et évoluer sans la pression des notes décourageantes ou des évaluations stressantes.

📄 Document 2 : La scolarisation à domicile représente un défi important. Elle demande un investissement considérable en temps, une organisation rigoureuse et des coûts associés. De plus, l'enfant n'a pas l'opportunité de côtoyer quotidiennement des camarades, ce qui limite ses interactions sociales.`},

  {id:76,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Animaux de compagnie pour enfants",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'intérêt d'avoir un animal de compagnie pour un enfant. (120–180 mots)

📄 Document 1 : Donner un animal de compagnie à un enfant comporte de nombreux bienfaits. Pour les enfants sans frères ni sœurs, l'animal devient un compagnon précieux. Grâce à lui, l'enfant gagne en confiance, apprend le respect envers un être vivant et développe son autonomie.

📄 Document 2 : Avant d'adopter un animal, il est important de bien réfléchir. Celui-ci devient un membre de la famille pour plusieurs années. Son entretien peut représenter un coût important et demande une responsabilité constante. Ce n'est pas un jouet dont on peut se débarrasser lorsque l'enfant perd son intérêt.`},

  {id:77,task:"tache3",theme:"👨‍👩‍👧 Famille & éducation",title:"Les vêtements de marque pour enfants",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les vêtements de marque pour les enfants. (120–180 mots)

📄 Document 1 : Les vêtements de marque jouent un rôle essentiel pour les enfants et adolescents en leur permettant de s'exprimer et de se sentir intégrés dans un groupe social. Cette attraction est particulièrement forte chez les adolescents qui cherchent à affirmer leur personnalité.

📄 Document 2 : Les enfants grandissent rapidement, ce qui rend leurs vêtements trop petits après peu de temps. De plus, jouer à l'extérieur fait que leurs vêtements s'usent vite et se salissent rapidement. Investir dans des vêtements de marque coûteux pour des enfants est donc peu pratique.`},

  {id:78,task:"tache3",theme:"💼 Travail & société",title:"Le rôle du travail dans notre vie",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la place du travail dans la vie des individus. (120–180 mots)

📄 Document 1 : Le travail occupe une place importante dans notre vie. Même s'il peut apporter de la satisfaction, il est souvent source de fatigue. Beaucoup de personnes constatent un déséquilibre entre leur vie professionnelle et personnelle et pensent qu'en travaillant moins, on serait plus heureux.

📄 Document 2 : Le travail fait partie de notre identité sociale. Selon le spécialiste Jean-Daniel Remond, la vie professionnelle contribue à se construire : elle permet de rencontrer des gens, de créer des réseaux, de se sentir utile et même de se faire des amis.`},

  {id:79,task:"tache3",theme:"💼 Travail & société",title:"Le travail : un bénéfice ou un frein ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le rôle du travail dans la vie personnelle et sociale. (120–180 mots)

📄 Document 1 : Le travail tient une place essentielle dans nos vies. Travailler devrait être source de réussite, mais pour beaucoup, il apporte surtout stress et contraintes. Certains considèrent qu'il est nécessaire de réévaluer son rôle et de réduire sa durée pour améliorer la qualité de vie.

📄 Document 2 : Certaines personnes ont décidé de quitter leur emploi pour adopter un autre style de vie. Pourtant, travailler reste important. La question « Que fais-tu dans la vie ? » montre que le travail fait partie de notre identité. L'entreprise contribue à construire notre personnalité.`},

  {id:80,task:"tache3",theme:"💼 Travail & société",title:"Réduction du temps de travail",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la réduction du temps de travail. (120–180 mots)

📄 Document 1 : Réduire le temps de travail aide les employés à trouver un meilleur équilibre entre vie professionnelle et personnelle. En ayant plus de temps libre, ils peuvent consacrer davantage de moments à leur famille et à leur santé. Cela améliore leur satisfaction et diminue le stress.

📄 Document 2 : Réduire les heures de travail peut aider les entreprises en réduisant l'absentéisme et en augmentant la fidélisation des employés. Cependant, cela nécessite une organisation efficace et une adaptation des processus pour maintenir la productivité.`},

  {id:81,task:"tache3",theme:"💼 Travail & société",title:"Productivité et confort au travail",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les moyens d'améliorer le bien-être au travail. (120–180 mots)

📄 Document 1 — Louise, responsable : « Nous avons mis en place des bureaux réglables en hauteur. Les employés sont satisfaits et affirment être plus performants. De plus, le climat social s'est amélioré et les échanges entre collègues sont plus fréquents. »

📄 Document 2 — Dubois, ingénieur : « Les entreprises cherchent toujours à augmenter la productivité. Pour ma part, ce qui compte, c'est de réaliser mon travail pendant mes heures normales, sans devoir faire des heures supplémentaires. »`},

  {id:82,task:"tache3",theme:"💼 Travail & société",title:"La sieste au travail",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'introduction de la sieste en milieu professionnel. (120–180 mots)

📄 Document 1 : Une courte sieste au travail pourrait augmenter la productivité et la créativité des employés de 35 %. Elle améliorerait également la mémoire et la concentration. Un employé reposé serait plus disponible pour ses tâches et moins stressé.

📄 Document 2 : Même si les bienfaits de la micro-sieste ont été prouvés scientifiquement, la sieste au bureau pose des difficultés pratiques. Toutes les entreprises ne peuvent pas disposer de salles spécifiques. Il faut aussi garantir l'égalité entre tous les salariés et établir une charte encadrant cette pratique.`},

  {id:83,task:"tache3",theme:"💼 Travail & société",title:"Les relations amicales au travail",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les amitiés entre collègues. (120–180 mots)

📄 Document 1 : Les amitiés entre collègues contribuent à instaurer un environnement de travail agréable. Avoir des amis au bureau permet de solidifier les relations professionnelles et d'instaurer un esprit de camaraderie, ce qui améliore la communication et facilite la résolution des problèmes.

📄 Document 2 : Il est essentiel de trouver un juste équilibre entre amitié et professionnalisme. Des amitiés trop proches peuvent engendrer des tensions lors de décisions professionnelles. Des amitiés exclusives entre certains collègues peuvent aussi marginaliser les autres et affecter la cohésion de l'équipe.`},

  {id:84,task:"tache3",theme:"💼 Travail & société",title:"Animaux de compagnie au bureau",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la présence d'animaux de compagnie au bureau. (120–180 mots)

📄 Document 1 : Apporter son animal au travail est une pratique qui se développe pour réduire le stress des employés. Les chiens ou les chats changent l'atmosphère de l'entreprise et diminuent les conflits. Un quart des salariés pensent que les animaux améliorent leur motivation.

📄 Document 2 — Alba, 32 ans : « Dans l'entreprise où je travaille, il est permis d'amener son animal. Pour ma part, cela me dérange. Je ne suis pas confortable avec les animaux. Cela peut aussi poser des problèmes de santé pour les employés allergiques et constitue une source de distraction. »`},

  {id:85,task:"tache3",theme:"💼 Travail & société",title:"Étudiants et travail saisonnier",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le travail saisonnier pour les étudiants. (120–180 mots)

📄 Document 1 : Les vacances permettent aux jeunes de se détendre. Pourtant, certains étudiants préfèrent travailler : garde d'enfants, restauration ou cueillette de fruits. Bien que ces emplois saisonniers aient des points positifs, ils limitent le temps libre et les jeunes manquent de repos et de moments en famille.

📄 Document 2 : Pour de nombreux étudiants, travailler durant les vacances représente une entrée dans la vie professionnelle et leur permet de développer le sens des responsabilités. Gagner de l'argent est aussi motivant. Certains travaillent pour ne plus dépendre financièrement de leurs parents.`},

  {id:86,task:"tache3",theme:"💼 Travail & société",title:"Jeunes et emploi : diplôme ou expérience ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'importance du diplôme versus l'expérience professionnelle. (120–180 mots)

📄 Document 1 : Les jeunes diplômés rencontrent des difficultés pour entrer sur le marché du travail. Même après plusieurs années d'études, les entreprises exigent souvent une expérience préalable. Pourtant, le diplôme reste essentiel pour acquérir des connaissances théoriques nécessaires à certains métiers spécialisés.

📄 Document 2 : Pour beaucoup d'employeurs, l'expérience professionnelle est plus importante que les diplômes. Un jeune ayant déjà travaillé sait mieux s'adapter à la réalité du terrain et gérer les responsabilités. Les stages et emplois étudiants permettent de développer des compétences concrètes.`},

  {id:87,task:"tache3",theme:"💼 Travail & société",title:"Femmes et hommes au travail",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'égalité entre femmes et hommes au travail. (120–180 mots)

📄 Document 1 : Dans certaines régions comme le Québec, l'égalité entre les femmes et les hommes est une réalité. Beaucoup de femmes occupent désormais des postes à responsabilité dans des domaines traditionnellement masculins. Avec les lois sur l'égalité, les femmes ont accès aux mêmes métiers que les hommes.

📄 Document 2 : Même si des efforts sont faits pour atteindre la parité, des inégalités demeurent. Certains métiers sont encore très féminisés. De plus, certaines personnes estiment que les femmes doivent rester à la maison pour s'occuper des enfants. Il reste beaucoup à faire pour garantir les mêmes chances à tous.`},

  {id:88,task:"tache3",theme:"💼 Travail & société",title:"Faut-il mettre une photo sur son CV ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'utilisation d'une photo dans un CV. (120–180 mots)

📄 Document 1 : Il faudrait interdire la photo sur le CV pour éviter toute discrimination. Selon une étude, les employeurs accordent plus d'attention à l'expérience professionnelle (32 %) et aux diplômes (15 %) qu'au physique. Seuls 2 % des recruteurs commencent par regarder la photo.

📄 Document 2 : L'utilisation d'une photo sur le CV divise les recruteurs. Certains estiment qu'elle aide à se faire une idée du candidat avant la rencontre et facilite la mémorisation. Pour les postes liés à l'accueil, la photo peut être appropriée, à condition d'être professionnelle.`},

  {id:89,task:"tache3",theme:"💼 Travail & société",title:"Aider les sans-abri : dons ou actions concrètes ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la meilleure façon d'aider les personnes sans-abri. (120–180 mots)

📄 Document 1 — Charlotte, 45 ans : « Chaque hiver, je consacre du temps et de l'argent pour aider les personnes sans-abri. Je trouve essentiel de donner quelques dollars à ces personnes ou aux associations qui les soutiennent. C'est un geste de solidarité que chacun peut réaliser. »

📄 Document 2 — Arthur, 54 ans : « Au lieu de donner de l'argent, il serait préférable de repenser notre façon de vivre. Je préfère m'investir dans une association de mon quartier. Les sans-abri ont besoin d'un logement et d'un emploi, pas seulement d'argent. »`},

  {id:90,task:"tache3",theme:"📱 Technologie & médias",title:"La télévision dans la société",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le rôle de la télévision dans la société actuelle. (120–180 mots)

📄 Document 1 : La télévision est un moyen de communication très présent dans la société. Elle permet de transmettre des informations, de proposer différents programmes de divertissement et de diffuser la culture. Elle reste une source d'information et de loisirs accessible à tous.

📄 Document 2 : La télévision présente aussi des aspects négatifs. Certains programmes peuvent transmettre des stéréotypes ou des valeurs discutables. Passer trop de temps devant la télévision diminue le temps consacré à des activités plus utiles. Il est nécessaire de limiter ce temps, surtout pour les enfants.`},

  {id:91,task:"tache3",theme:"📱 Technologie & médias",title:"Publicité et enfants : bénéfique ou nocif ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la publicité destinée aux enfants. (120–180 mots)

📄 Document 1 : La publicité destinée aux enfants permet de leur faire découvrir de nouveaux produits, jeux ou services adaptés à leur âge. Certaines campagnes peuvent également transmettre des messages éducatifs ou sensibiliser les jeunes à des sujets importants comme l'environnement ou la santé.

📄 Document 2 : Les enfants sont particulièrement influençables face à la publicité. Beaucoup de messages publicitaires les poussent à consommer davantage ou à réclamer des produits inutiles. Certaines publicités alimentaires favorisent également une mauvaise alimentation avec des conséquences négatives sur leur santé.`},

  {id:92,task:"tache3",theme:"📱 Technologie & médias",title:"La publicité alimentaire ciblant les enfants",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la place de la publicité dans notre quotidien. (120–180 mots)

📄 Document 1 — Lucien, 28 ans : « La publicité est très utile pour les entreprises. Elle sert à présenter un produit ou un service. Elle m'aide à découvrir les nouveautés et les offres spéciales. Sans la publicité, les jeux gratuits sur téléphone seraient payants. »

📄 Document 2 — Alma, 35 ans : « Nous sommes entourés de publicité tous les jours. Les émissions télévisées sont souvent coupées par des pubs, ce qui peut être irritant. Recevoir des kilos de publicité chaque année dans la boîte aux lettres n'est pas bon pour l'environnement. »`},

  {id:93,task:"tache3",theme:"📱 Technologie & médias",title:"La publicité : utile ou gênante ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les avantages et inconvénients de la publicité. (120–180 mots)

📄 Document 1 — Elena, 28 ans : « La publicité est essentielle au fonctionnement du commerce. Grâce à elle, on découvre de nouveaux produits et services. Certaines publicités sont même amusantes ! Sans la publicité, de nombreuses applications ou jeux gratuits deviendraient payants. »

📄 Document 2 — Alicia, 35 ans : « La publicité fait partie de notre vie quotidienne et certaines émissions sont interrompues par des publicités, ce qui est agaçant. Recevoir chaque année beaucoup de papiers publicitaires dans la boîte aux lettres n'est pas bon pour l'environnement. »`},

  {id:94,task:"tache3",theme:"📱 Technologie & médias",title:"Jeux vidéo : un loisir utile ou dangereux ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les effets des jeux vidéo. (120–180 mots)

📄 Document 1 : Des recherches ont montré que certaines parties du cerveau des adultes peuvent se développer grâce aux jeux vidéo. Jouer aide à renforcer l'analyse, la prise de décision et la rapidité de réaction. 83 % des joueurs sont des adultes.

📄 Document 2 : Durant trois ans, des chercheurs ont observé des enfants de 8 à 17 ans. Les conclusions indiquent que les enfants qui jouent beaucoup aux jeux vidéo deviennent plus violents, plus tendus et réussissent moins bien à l'école.`},

  {id:95,task:"tache3",theme:"📱 Technologie & médias",title:"Les jeux vidéo : bienfaits cognitifs ou risque de dépendance ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les jeux vidéo et leurs effets sur le cerveau. (120–180 mots)

📄 Document 1 : Certaines études montrent que les jeux vidéo peuvent développer plusieurs capacités cognitives : la mémoire, la rapidité de réaction et la capacité à résoudre des problèmes. Les jeux de stratégie améliorent également la concentration et l'esprit d'analyse.

📄 Document 2 : Les jeux vidéo présentent aussi des risques importants en cas d'utilisation excessive. Certains jeunes passent de nombreuses heures devant leurs écrans et deviennent dépendants, ce qui peut entraîner des problèmes scolaires, un manque d'activité physique et un isolement social.`},

  {id:96,task:"tache3",theme:"📱 Technologie & médias",title:"Objets connectés : progrès ou danger ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les objets connectés. (120–180 mots)

📄 Document 1 : Les objets connectés rendent le quotidien plus pratique. Il s'agit d'appareils contrôlés à distance via un téléphone ou Internet. Les montres connectées permettent de suivre l'activité physique. Leur rôle est particulièrement utile dans le secteur de la santé.

📄 Document 2 : On pense qu'il existe environ 50 milliards d'objets connectés à travers le monde. Ce développement entraîne des risques liés à la sécurité. Un hacker peut contrôler un objet connecté en peu de temps. Un cambrioleur pourrait vérifier via des caméras connectées si une maison est vide.`},

  {id:97,task:"tache3",theme:"📱 Technologie & médias",title:"Le livre papier ou le livre numérique ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur votre préférence entre le livre papier et le livre numérique. (120–180 mots)

📄 Document 1 : Le livre numérique offre de nombreux avantages pratiques. Grâce aux liseuses et tablettes, il est possible de transporter des centaines de livres sans prendre de place. Les livres numériques sont souvent moins chers et peuvent être téléchargés instantanément.

📄 Document 2 : Malgré les progrès du numérique, beaucoup de lecteurs restent attachés au livre papier. Tourner les pages et posséder une bibliothèque physique procurent un plaisir particulier. De plus, la lecture sur écran peut fatiguer les yeux et réduire la concentration.`},

  {id:98,task:"tache3",theme:"🏡 Mode de vie & logement",title:"Vivre en colocation à l'âge adulte",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la vie en colocation. (120–180 mots)

📄 Document 1 : La vie en colocation demande de bien s'entendre et de suivre des règles communes. On ne peut pas toujours mettre la musique à volume élevé ou inviter tous ses amis. Une bonne organisation et la communication permettent une colocation réussie.

📄 Document 2 : Vivre en colocation est un choix pratique pour avoir un logement plus spacieux à moindre coût. En divisant le loyer et les frais avec vos colocataires, vous dépensez beaucoup moins que pour un logement individuel, tout en accédant parfois à un appartement en centre-ville.`},

  {id:99,task:"tache3",theme:"🏡 Mode de vie & logement",title:"Maisons de retraite ou maintien à domicile ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la meilleure solution pour les personnes âgées. (120–180 mots)

📄 Document 1 — Sophie, infirmière : « Les maisons de retraite représentent une solution adaptée pour les personnes âgées. Elles y bénéficient de soins appropriés et d'un encadrement professionnel. Elles peuvent participer à diverses activités qui leur permettent de garder une vie sociale et d'éviter la solitude. »

📄 Document 2 — Jean, retraité : « Les maisons de retraite peuvent priver les personnes âgées de la présence de leur famille et donner l'impression d'être abandonné. Les conditions de vie ne sont pas toujours satisfaisantes. Selon moi, l'aide à domicile est une meilleure solution. »`},

  {id:100,task:"tache3",theme:"🌐 Culture & loisirs",title:"L'accès gratuit aux musées",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la gratuité des musées. (120–180 mots)

📄 Document 1 : La gratuité fait partie des principes fondamentaux des musées et symbolise le partage culturel. Une fois par mois, l'entrée des musées nationaux est gratuite pour tous. Cette mesure a pour but de faire venir de nouveaux visiteurs, car le musée reste avant tout un lieu d'éducation.

📄 Document 2 : Rendre les musées totalement gratuits est une fausse bonne idée. Les musées doivent recevoir des fonds pour maintenir et développer leurs collections. Une solution plus adaptée est de proposer des entrées à tarif réduit pour des publics ciblés, accompagnées d'activités adaptées.`},

  {id:101,task:"tache3",theme:"🌐 Culture & loisirs",title:"L'impact des grands événements sportifs",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'organisation de grands événements sportifs internationaux. (120–180 mots)
