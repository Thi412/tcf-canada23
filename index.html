📄 Document 1 : Les grands événements sportifs internationaux, comme les Jeux olympiques ou la Coupe du monde, attirent des millions de visiteurs et stimulent l'économie du pays organisateur. Ils permettent aussi de développer les infrastructures, de créer des emplois et d'améliorer l'image du pays à l'étranger.

📄 Document 2 : Ces événements coûtent souvent très cher et peuvent entraîner des problèmes économiques ou environnementaux. Certains stades deviennent inutiles après les compétitions et les habitants doivent parfois supporter une augmentation des impôts. L'afflux massif de touristes peut aussi provoquer des nuisances.`},

  {id:102,task:"tache3",theme:"🐾 Animaux",title:"La chasse : une pratique à soutenir ou à rejeter ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur la pratique de la chasse. (120–180 mots)

📄 Document 1 — Sophie, 28 ans : « Je fais partie de ceux qui ne parviennent pas à comprendre comment on peut prendre plaisir à tuer des animaux. Je ne saisis pas comment on peut prétendre aimer la nature tout en contribuant à sa destruction. »

📄 Document 2 — Bernard, journaliste : « La chasse est pratiquée pour diverses raisons : se nourrir, commercer, gérer la faune, protéger la propriété, faire de l'exercice, se divertir ou chercher du prestige. »`},

  {id:103,task:"tache3",theme:"🐾 Animaux",title:"Les zoos : outils de conservation ou prisons pour animaux ?",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur le rôle des zoos dans la société actuelle. (120–180 mots)

📄 Document 1 : Les zoos jouent un rôle important dans la protection des espèces menacées. Grâce aux programmes de reproduction et aux soins vétérinaires, ils permettent de préserver des animaux qui risqueraient de disparaître. Ils ont également une mission éducative, sensibilisant les visiteurs à la biodiversité.

📄 Document 2 : Pour leurs opposants, les zoos sont des lieux où les animaux vivent enfermés dans des espaces artificiels, loin de leur environnement naturel. Certains animaux souffrent du manque de liberté. Il vaudrait mieux protéger les espèces dans leur habitat naturel plutôt qu'en captivité.`},

  {id:104,task:"tache3",theme:"📚 Apprentissage & langues",title:"Apprendre une langue en ligne",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur l'apprentissage d'une langue en ligne. (120–180 mots)

📄 Document 1 : Grâce à Internet, il est tout à fait possible d'apprendre une langue en ligne avec de très bons résultats. On peut suivre les leçons quand on le souhaite, disponibles 24h/24. Cela aide à mieux gérer son emploi du temps et à économiser de l'argent.

📄 Document 2 : Apprendre une langue en ligne n'est pas accessible à tous. Il faut avoir un bon accès à Internet et un équipement numérique suffisant. De plus, étudier seul à la maison demande beaucoup d'autonomie et de motivation, surtout sans l'aide d'un enseignant ou d'autres apprenants.`},

  {id:105,task:"tache3",theme:"📚 Apprentissage & langues",title:"Les cours de langues en ligne",level:"B2-C1",prompt:`Lisez les deux documents et rédigez un texte argumenté sur les cours de langues en ligne. (120–180 mots)

📄 Document 1 : Les cours de langues en ligne offrent une grande flexibilité. Les apprenants peuvent suivre les leçons à leur rythme et organiser leur emploi du temps selon leurs besoins. Cette solution permet également d'économiser du temps et de l'argent en évitant les déplacements.

📄 Document 2 : Cependant, apprendre une langue en ligne demande beaucoup d'autonomie et de motivation. Certains étudiants ont du mal à rester concentrés lorsqu'ils travaillent seuls devant un écran. De plus, les échanges humains et la pratique orale sont parfois moins naturels qu'en présentiel.`},

// ─── SPEAKING ─────────────────────────────────────────────────────────────────
const SpeakingCoach=({topic,sit,userApiKey,plan,onUpgrade,aiUsage,setAiUsage,maxDur=90})=>{
  const [status,setStatus]=useState("idle"); // idle|recording|transcribing|thinking|done
  const [transcript,setTranscript]=useState("");
  const [feedback,setFeedback]=useState(null);
  const [err,setErr]=useState("");
  const [duration,setDuration]=useState(0);
  const mediaRef=useRef(null);
  const chunksRef=useRef([]);
  const timerRef=useRef(null);
  const isPaid=plan!=="starter";

  const p=PLANS[plan];
  const tacheKey=maxDur<=100?"coach_t2":"coach_t3";
  const coachLimit=p?.[maxDur<=100?"coachT2":"coachT3"]||0;
  const coachUsed=aiUsage?.[tacheKey]||0;
  const canUse=userApiKey||(isPaid&&coachUsed<coachLimit);
  const scoreColor=s=>s>=8?C.green:s>=6?C.amber:C.red;
  const niveauColor=n=>n==="C1"?C.purple:n==="B2"?C.green:n==="B1"?C.amber:C.red;

  const startRec=async()=>{
    if(!canUse){onUpgrade(isPaid?"Limite quotidienne atteinte — passez au plan supérieur":"Débloquez le Coach vocal IA");return;}
    setErr("");setTranscript("");setFeedback(null);setDuration(0);
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,sampleRate:16000}});
      const mr=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm"});
      chunksRef.current=[];
      mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
      mr.start(250);
      mediaRef.current=mr;
      setStatus("recording");
      timerRef.current=setInterval(()=>setDuration(d=>{
        if(d>=maxDur-1){stopAndTranscribe();return d;}
        return d+1;
      }),1000);
    }catch(e){setErr("Impossible d'accéder au microphone. Vérifiez les permissions.");setStatus("idle");}
  };

  const stopAndTranscribe=async()=>{
    clearInterval(timerRef.current);
    if(!mediaRef.current)return;
    setStatus("transcribing");
    await new Promise(resolve=>{
      mediaRef.current.onstop=resolve;
      mediaRef.current.stop();
      mediaRef.current.stream.getTracks().forEach(t=>t.stop());
    });
    const blob=new Blob(chunksRef.current,{type:"audio/webm"});
    if(blob.size<1000){setErr("Enregistrement trop court. Parlez plus longtemps.");setStatus("idle");return;}

    try{
      let text="";
      if(userApiKey){
        // Direct Whisper call with user key
        const fd=new FormData();
        fd.append("file",blob,"audio.webm");
        fd.append("model","whisper-1");
        fd.append("language","fr");
        const r=await fetch("https://api.openai.com/v1/audio/transcriptions",{
          method:"POST",
          headers:{"Authorization":`Bearer ${userApiKey}`},
          body:fd
        });
        const d=await r.json();
        text=d.text||"";
      } else {
        // Via server proxy
        const fd=new FormData();
        fd.append("audio",blob,"audio.webm");
        const r=await fetch("/api/transcribe",{method:"POST",body:fd});
        const d=await r.json();
        text=d.text||"";
      }

      if(!text.trim()){setErr("Aucune parole détectée. Réessayez.");setStatus("idle");return;}
      setTranscript(text);
      setStatus("thinking");
      await analyze(text);
    }catch(e){
      setErr("Erreur de transcription. Vérifiez votre connexion.");
      setStatus("idle");
    }
  };

  const analyze=async(text)=>{
    const context=topic?`Sujet TCF: "${topic.title}" — Question: "${topic.q}"`:sit?`Situation TCF: "${sit}"`:"Expression orale TCF Canada";
    const prompt=`Examinateur TCF Canada. Évalue cette réponse orale.
Contexte: ${context}
Réponse: "${text}"
JSON uniquement:
{"score":<0-10>,"niveau":"<A2|B1|B2|C1>","points_forts":["<p1>","<p2>"],"a_ameliorer":["<p1>","<p2>"],"vocabulaire":"<bref>","grammaire":"<bref>","conseil":"<1 conseil>","phrase_amelioree":"<1 phrase B2/C1>"}`;

    try{
      const endpoint=userApiKey?"https://api.openai.com/v1/chat/completions":"/api/chat";
      const headers={"Content-Type":"application/json",...(userApiKey?{"Authorization":`Bearer ${userApiKey}`}:{})};
      const res=await fetch(endpoint,{method:"POST",headers,body:JSON.stringify({model:"gpt-4o-mini",max_tokens:350,messages:[{role:"user",content:prompt}]})});
      const d=await res.json();
      const txt=d.choices?.[0]?.message?.content||"{}";
      const clean=txt.replace(/```json|```/g,"").trim();
      setFeedback(JSON.parse(clean));
      setStatus("done");
      if(!userApiKey&&setAiUsage)setAiUsage(u=>({...u,[tacheKey]:(u[tacheKey]||0)+1}));
    }catch(e){
      setErr("Erreur d'analyse. Vérifiez votre connexion.");
      setStatus("idle");
    }
  };

  const reset=()=>{setStatus("idle");setTranscript("");setFeedback(null);setErr("");setDuration(0);};
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const durLabel=maxDur>=120?fmt(maxDur):maxDur+"s";
  const niveauColor=n=>n==="C1"?C.purple:n==="B2"?C.green:n==="B1"?C.amber:C.red;

  return(<div style={{border:`1.5px solid ${"#0ea5e9"}44`,borderRadius:14,overflow:"hidden",marginTop:16}}>
    <div style={{background:"linear-gradient(135deg,#0ea5e908,#0ea5e918)",padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <span style={{fontSize:22}}>🎤</span>
        <div>
          <div style={{fontWeight:600,fontSize:16,color:"#0ea5e9"}}>Coach vocal IA — Whisper</div>
          <div style={{fontSize:13,color:C.gray}}>Whisper + GPT · ~$0.01/analyse · max {durLabel}</div>
        </div>
      </div>
      {!canUse&&<Btn ch="Débloquer →" v="ghost" sm onClick={()=>onUpgrade("Débloquez le Coach vocal IA")} sx={{borderColor:"#0ea5e9",color:"#0ea5e9"}}/>}
      {canUse&&!userApiKey&&<span style={{fontSize:13,color:C.gray}}>{coachLimit-coachUsed} restant{coachLimit-coachUsed>1?"s":""}</span>}
    </div>
    <div style={{padding:"14px 16px"}}>
      {err&&<div style={{fontSize:14,color:C.red,background:C.red+"0d",padding:"8px 12px",borderRadius:8,marginBottom:10}}>{err}</div>}
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12,flexWrap:"wrap"}}>
        {status==="idle"&&<button onClick={startRec} disabled={!canUse}
          style={{display:"flex",alignItems:"center",gap:8,background:"#0ea5e9",color:"#fff",border:"none",borderRadius:10,padding:"10px 20px",fontSize:17,fontWeight:600,cursor:canUse?"pointer":"not-allowed",opacity:canUse?1:0.5}}>
          🎙 Commencer à parler
        </button>}
        {status==="recording"&&<>
          <button onClick={stopAndTranscribe}
            style={{display:"flex",alignItems:"center",gap:8,background:C.red,color:"#fff",border:"none",borderRadius:10,padding:"10px 20px",fontSize:17,fontWeight:600,cursor:"pointer"}}>
            ⏹ Arrêter
          </button>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:C.red,animation:"pulse 1s ease-in-out infinite alternate"}}/>
            <span style={{fontSize:16,color:C.red,fontWeight:600}}>{fmt(duration)}</span>
            <span style={{fontSize:14,color:C.gray}}>max {durLabel}</span>
            {duration>=maxDur-30&&<span style={{fontSize:13,color:C.amber}}>⚠ Bientôt la limite</span>}
          </div>
        </>}
        {status==="transcribing"&&<div style={{display:"flex",gap:8,alignItems:"center",color:"#0ea5e9",fontSize:16}}>
          <span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</span> Transcription Whisper...
        </div>}
        {status==="thinking"&&<div style={{display:"flex",gap:8,alignItems:"center",color:C.purple,fontSize:16}}>
          <span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⟳</span> Analyse IA en cours...
        </div>}
        {status==="done"&&<button onClick={reset}
          style={{background:"none",border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 14px",fontSize:14,cursor:"pointer",color:C.gray}}>
          🔄 Recommencer
        </button>}
      </div>
      {transcript&&<div style={{background:"#f4f3f0",borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:16,lineHeight:1.6,color:"#333",borderLeft:"3px solid #0ea5e9"}}>
        <div style={{fontSize:13,color:C.gray,marginBottom:4,fontWeight:500,display:"flex",justifyContent:"space-between"}}>
          <span>TRANSCRIPTION WHISPER</span>
          <span style={{color:"#0ea5e9"}}>✓ Précis</span>
        </div>
        {transcript}
      </div>}
      {feedback&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <div style={{background:scoreColor(feedback.score)+"15",border:`1.5px solid ${scoreColor(feedback.score)}`,borderRadius:12,padding:"10px 18px",textAlign:"center",minWidth:70}}>
            <div style={{fontSize:28,fontWeight:700,color:scoreColor(feedback.score)}}>{feedback.score}<span style={{fontSize:17}}>/10</span></div>
            <div style={{fontSize:11,color:C.gray}}>Score</div>
          </div>
          <div style={{background:niveauColor(feedback.niveau)+"15",border:`1.5px solid ${niveauColor(feedback.niveau)}`,borderRadius:12,padding:"10px 18px",textAlign:"center",minWidth:60}}>
            <div style={{fontSize:24,fontWeight:700,color:niveauColor(feedback.niveau)}}>{feedback.niveau}</div>
            <div style={{fontSize:11,color:C.gray}}>Niveau</div>
          </div>
          <div style={{flex:1,minWidth:180}}>
            {feedback.points_forts?.map((p,i)=><div key={i} style={{fontSize:14,color:C.green,marginBottom:3}}>✓ {p}</div>)}
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div style={{background:"#f4f3f0",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:13,fontWeight:600,color:C.gray,marginBottom:4}}>📚 VOCABULAIRE</div>
            <div style={{fontSize:14,lineHeight:1.5}}>{feedback.vocabulaire}</div>
          </div>
          <div style={{background:"#f4f3f0",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:13,fontWeight:600,color:C.gray,marginBottom:4}}>🔧 GRAMMAIRE</div>
            <div style={{fontSize:14,lineHeight:1.5}}>{feedback.grammaire}</div>
          </div>
        </div>
        {feedback.a_ameliorer?.length>0&&<div style={{background:C.amber+"0d",borderRadius:10,padding:"10px 12px",borderLeft:`3px solid ${C.amber}`}}>
          <div style={{fontSize:13,fontWeight:600,color:C.amber,marginBottom:6}}>⚠ À AMÉLIORER</div>
          {feedback.a_ameliorer.map((p,i)=><div key={i} style={{fontSize:14,marginBottom:3}}>• {p}</div>)}
        </div>}
        {feedback.conseil&&<div style={{background:"#0ea5e908",borderRadius:10,padding:"10px 12px",borderLeft:"3px solid #0ea5e9"}}>
          <div style={{fontSize:13,fontWeight:600,color:"#0ea5e9",marginBottom:4}}>💡 CONSEIL</div>
          <div style={{fontSize:14,lineHeight:1.5}}>{feedback.conseil}</div>
        </div>}
        {feedback.phrase_amelioree&&<div style={{background:C.purple+"0d",borderRadius:10,padding:"10px 12px",borderLeft:`3px solid ${C.purple}`}}>
          <div style={{fontSize:13,fontWeight:600,color:C.purple,marginBottom:4}}>✨ VERSION B2/C1</div>
          <div style={{fontSize:16,lineHeight:1.6,fontStyle:"italic",color:C.purple}}>{feedback.phrase_amelioree}</div>
        </div>}
      </div>}
    </div>
    <style>{`@keyframes pulse{to{opacity:.3}}@keyframes spin{to{transform:rotate(360deg)}}`}</style>
  </div>);
};

const Speaking=({plan,aiUsage,setAiUsage,onUpgrade,ct,onAdd,userApiKey})=>{

      </div>

          <Badge ch={type} color={type==="CE"?C.green:C.purple}/>
          {isCustom&&<Badge ch="Perso" color={C.amber}/>}
          <span style={{fontWeight:500,fontSize:17}}>{t.title}</span>
          {(()=>{const r=(testResults||[]).find(x=>x.testId===t.id);return r?<span style={{fontSize:11,background:r.pct>=80?C.green+"22":r.pct>=60?C.amber+"22":C.red+"22",color:r.pct>=80?C.green:r.pct>=60?C.amber:C.red,borderRadius:20,padding:"2px 8px",fontWeight:600}}>{r.pct}% ✓</span>:null;})()}
        </div><div style={{fontSize:14,color:C.gray}}>{t.questions.length} questions{(testResults||[]).find(x=>x.testId===t.id)?<span style={{color:C.gray}}> · fait le {new Date((testResults||[]).find(x=>x.testId===t.id)?.date).toLocaleDateString("fr-CA")}</span>:null}</div></div>
        <div style={{display:"flex",gap:6}}>
          {locked
            ?<Btn ch="🔒 Débloquer" v="ghost" sm onClick={()=>onUpgrade("Accédez à tous les tests")}/>
            :<Btn ch="Commencer →" sm onClick={()=>onStart(t)}/>}
        </div>
      </div>}/>);
    })}</div>
  </div>);
};

const TestAdminPanel=({type,editTest,onSave,onClose})=>{
  const isEdit=!!editTest;
  const [title,setTitle]=useState(editTest?.title||"");
  const [questions,setQuestions]=useState(editTest?.questions||[{q:"",opts:["","","",""],ans:0,passage:"",audio:"",image:"",transcript:""}]);
  const isCO=type==="CO";
  const [transcribing,setTranscribing]=useState({});
  const adminApiKey=localStorage.getItem("admin_oai_key")||"";
  const transcribeAudio=async(qi,audioUrl)=>{
    if(!audioUrl.trim()){alert("Please enter an audio URL first.");return;}
    const key=adminApiKey||prompt("Enter your OpenAI API key (stored locally):");
    if(!key)return;
    if(!adminApiKey)localStorage.setItem("admin_oai_key",key);
    setTranscribing(t=>({...t,[qi]:true}));
    try{
      const res=await fetch(audioUrl);
      if(!res.ok)throw new Error("Cannot fetch audio: "+res.status);
      const blob=await res.blob();
      const fname=audioUrl.split("/").pop()||"audio.mp3";
      const file=new File([blob],fname,{type:blob.type||"audio/mpeg"});
      const form=new FormData();
      form.append("file",file,fname);
      form.append("model","whisper-1");
      form.append("language","fr");
      form.append("response_format","text");
      const r=await fetch("https://api.openai.com/v1/audio/transcriptions",{
        method:"POST",headers:{Authorization:"Bearer "+key},body:form
      });
      if(!r.ok){const e=await r.json();throw new Error(e.error?.message||"Whisper error");}
      const text=await r.text();
      updateQ(qi,"transcript",text.trim());
    }catch(e){alert("Transcription error: "+e.message);}
    setTranscribing(t=>({...t,[qi]:false}));
  };
  const inp={padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,fontSize:16,background:"#f4f3f0",color:"#1a1a1a",width:"100%",boxSizing:"border-box"};
  const addQ=()=>setQuestions(qs=>[...qs,{q:"",opts:["","","",""],ans:0,passage:"",audio:"",image:"",transcript:""}]);
  const removeQ=i=>setQuestions(qs=>qs.filter((_,j)=>j!==i));
  const updateQ=(i,f,v)=>setQuestions(qs=>qs.map((q,j)=>j===i?{...q,[f]:v}:q));
  const updateOpt=(qi,oi,v)=>setQuestions(qs=>qs.map((q,j)=>j===qi?{...q,opts:q.opts.map((o,k)=>k===oi?v:o)}:q));
  const submit=()=>{
    if(!title.trim())return;
    const vqs=questions.filter(q=>q.q.trim()&&q.opts.filter(o=>o.trim()).length>=2);
    if(!vqs.length)return;
    onSave({id:editTest?.id||"ct_"+Date.now(),type,title,custom:true,questions:vqs.map(q=>({...q,opts:q.opts.filter(o=>o.trim())}))});
    onClose();
  };
  return(<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1000,overflowY:"auto",padding:"1rem"}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:"2rem",maxWidth:680,width:"100%",marginTop:"1rem"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.5rem"}}>
        <h3 style={{margin:0,fontWeight:500}}>{isEdit?"✏️ Modifier":`➕ Nouveau test ${type}`}</h3>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:24,cursor:"pointer",color:C.gray}}>x</button>
      </div>
      <input style={{...inp,marginBottom:16}} value={title} onChange={e=>setTitle(e.target.value)} placeholder="Titre *"/>
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {questions.map((q,qi)=>(
          <div key={qi} style={{border:`1px solid ${C.border}`,borderRadius:12,padding:"1rem",background:"#fafafa"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
              <span style={{fontWeight:600,fontSize:16,color:C.gray}}>Q{qi+1}</span>
              {questions.length>1&&<button onClick={()=>removeQ(qi)} style={{background:"none",border:"none",color:C.red,cursor:"pointer"}}>x</button>}
            </div>
            {!isCO&&<textarea style={{...inp,minHeight:60,resize:"vertical",marginBottom:8}} value={q.passage} onChange={e=>updateQ(qi,"passage",e.target.value)} placeholder="Passage (optionnel)"/>}
            {isCO&&<input style={{...inp,marginBottom:8}} value={q.audio} onChange={e=>updateQ(qi,"audio",e.target.value)} placeholder="URL audio"/>}
            {isCO&&<input style={{...inp,marginBottom:8}} value={q.image} onChange={e=>updateQ(qi,"image",e.target.value)} placeholder="URL image"/>}
            {isCO&&<div style={{position:"relative",marginBottom:8}}>
              <textarea style={{...inp,minHeight:60,resize:"vertical",paddingRight:140}} value={q.transcript||""} onChange={e=>updateQ(qi,"transcript",e.target.value)} placeholder="Transcript (optionnel)"/>
              <button onClick={()=>transcribeAudio(qi,q.audio)} disabled={transcribing[qi]||!q.audio} style={{position:"absolute",top:8,right:8,background:transcribing[qi]?"#ccc":C.green,color:"#fff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:transcribing[qi]||!q.audio?"not-allowed":"pointer",fontWeight:500}}>
                {transcribing[qi]?"⟳ Transcribing...":"🎙 Auto"}
              </button>
            </div>}
            <input style={{...inp,marginBottom:8}} value={q.q} onChange={e=>updateQ(qi,"q",e.target.value)} placeholder="Question *"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {q.opts.map((o,oi)=>(<label key={oi} style={{display:"flex",gap:6,alignItems:"center"}}>
                <input type="radio" name={`a${qi}`} checked={q.ans===oi} onChange={()=>updateQ(qi,"ans",oi)} style={{accentColor:C.green}}/>
                <input style={{...inp,border:`1px solid ${q.ans===oi?C.green:C.border}`}} value={o} onChange={e=>updateOpt(qi,oi,e.target.value)} placeholder={`Option ${oi+1}`}/>
              </label>))}
            </div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginTop:"1rem"}}>
        <Btn ch="+ Question" v="secondary" onClick={addQ}/>
        <Btn ch={isEdit?"Enregistrer":"Créer"} full onClick={submit} dis={!title.trim()}/>
        <Btn ch="Annuler" v="ghost" onClick={onClose}/>
      </div>
    </div>
  </div>);
};

const TestRunner=({test,onBack,onEditQuestion})=>{
  const [ans,setAns]=useState({});
  const [editQ,setEditQ]=useState(null);
  const [transcribingEdit,setTranscribingEdit]=useState(false);
  const isCO=test.type==="CO";
  const total=test.questions.length;
  const answered=Object.keys(ans).length;
  const allDone=answered===total;
  const score=allDone?test.questions.filter((q,i)=>ans[i]===q.ans).length:0;
  const pct=allDone?Math.round((score/total)*100):0;
  const scoreColor=pct>=80?C.green:pct>=60?C.amber:C.red;
  const scoreBg=pct>=80?"#f0fdf4":pct>=60?"#fffbeb":"#fef2f2";
  const scoreLabel=pct>=80?"Excellent ! 🎉":pct>=60?"Continuez ! 💪":"À retravailler 📚";
  const inp={padding:"8px 10px",borderRadius:7,border:`1px solid ${C.border}`,fontSize:16,background:"#f4f3f0",color:"#1a1a1a",width:"100%"};

  const transcribeEditAudio=async()=>{
    const audioUrl=editQ?.audio;
    if(!audioUrl?.trim()){alert("Please enter an audio URL first.");return;}
    const key=localStorage.getItem("admin_oai_key")||localStorage.getItem("oai_key")||prompt("Enter your OpenAI API key:");
    if(!key)return;
    localStorage.setItem("admin_oai_key",key);
    setTranscribingEdit(true);
    try{
      const res=await fetch(audioUrl);
      if(!res.ok)throw new Error("Cannot fetch audio: "+res.status);
      const blob=await res.blob();
      const fname=audioUrl.split("/").pop()||"audio.mp3";
      const file=new File([blob],fname,{type:blob.type||"audio/mpeg"});
      const form=new FormData();
      form.append("file",file,fname);
      form.append("model","whisper-1");
      form.append("language","fr");
      form.append("response_format","text");
      const r=await fetch("https://api.openai.com/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+key},body:form});
      if(!r.ok){const e=await r.json();throw new Error(e.error?.message||"Whisper error");}
      const text=await r.text();
      setEditQ(eq=>({...eq,transcript:text.trim()}));
    }catch(e){alert("Error: "+e.message);}
    setTranscribingEdit(false);
  };

  const buildTranscript=()=>{
    if(!test.transcript) return null;
    let html=test.transcript;
    test.questions.forEach(q=>{
      if(q.keyword){
        const escaped=q.keyword.split('').map(c=>'.*+?^${}()|[]\\'.includes(c)?'\\'+c:c).join('');
        html=html.replace(new RegExp(escaped,'gi'),m=>`<mark style="background:#fef08a;color:#713f12;border-radius:3px;padding:1px 3px;font-weight:500;">${m}</mark>`);
      }
    });
    return '<p style="margin:0 0 10px;line-height:1.8;">'+html.replace(/\n\n/g,'</p><p style="margin:0 0 10px;line-height:1.8;">')+'</p>';
  };

  const saveEdit=()=>{
    if(onEditQuestion&&editQ)onEditQuestion(editQ.qi,{q:editQ.q,opts:editQ.opts,ans:editQ.ans,passage:editQ.passage,audio:editQ.audio,image:editQ.image,transcript:editQ.transcript});
    setEditQ(null);
  };

  const handleSelect=(qi,oi)=>{
    if(ans[qi]!==undefined) return;
    const newAns={...ans,[qi]:oi};
    setAns(newAns);
    if(Object.keys(newAns).length===total){
      const sc=test.questions.filter((q,i)=>newAns[i]===q.ans).length;
      const result={testId:test.id,testTitle:test.title,type:test.type,score:sc,total,pct:Math.round(sc/total*100),date:new Date().toISOString(),answers:{...newAns}};
      try{const prev=JSON.parse(localStorage.getItem('tcf_results')||'[]');const filtered=prev.filter(r=>r.testId!==test.id);localStorage.setItem('tcf_results',JSON.stringify([result,...filtered].slice(0,200)));}catch(e){}
    }
  };

  const LETTERS=["A","B","C","D"];

  return(
    <div style={{maxWidth:600,margin:"0 auto",paddingBottom:32}}>

      {/* ── Edit Modal ── */}
      {editQ&&<div onClick={()=>setEditQ(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}}>
        <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,padding:"1.5rem",maxWidth:520,width:"92%",maxHeight:"88vh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
            <h3 style={{margin:0,fontWeight:600,fontSize:17}}>✏️ Question {editQ.qi+1}</h3>
            <button onClick={()=>setEditQ(null)} style={{background:"none",border:"none",fontSize:24,cursor:"pointer",color:C.gray,lineHeight:1}}>×</button>
          </div>
          {!isCO&&<textarea style={{...inp,minHeight:70,resize:"vertical",marginBottom:8}} value={editQ.passage||""} onChange={e=>setEditQ(eq=>({...eq,passage:e.target.value}))} placeholder="Passage text..."/>}
          {isCO&&<input style={{...inp,marginBottom:8}} value={editQ.audio||""} onChange={e=>setEditQ(eq=>({...eq,audio:e.target.value}))} placeholder="Audio URL..."/>}
          {isCO&&<div style={{position:"relative",marginBottom:8}}>
            <textarea style={{...inp,minHeight:60,resize:"vertical",paddingRight:140}} value={editQ.transcript||""} onChange={e=>setEditQ(eq=>({...eq,transcript:e.target.value}))} placeholder="Transcript (optional)"/>
            <button onClick={transcribeEditAudio} disabled={transcribingEdit||!editQ?.audio} style={{position:"absolute",top:8,right:8,background:transcribingEdit?"#ccc":C.green,color:"#fff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:transcribingEdit||!editQ?.audio?"not-allowed":"pointer",fontWeight:500}}>
              {transcribingEdit?"⟳ ...":"🎙 Auto"}
            </button>
          </div>}
          {isCO&&<input style={{...inp,marginBottom:8}} value={editQ.image||""} onChange={e=>setEditQ(eq=>({...eq,image:e.target.value}))} placeholder="Image URL (optional)..."/>}
          <input style={{...inp,marginBottom:12}} value={editQ.q} onChange={e=>setEditQ(eq=>({...eq,q:e.target.value}))} placeholder="Question..."/>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
            {editQ.opts.map((o,oi)=>(
              <label key={oi} style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="radio" name="editans" checked={editQ.ans===oi} onChange={()=>setEditQ(eq=>({...eq,ans:oi}))} style={{accentColor:C.green}}/>
                <input style={{...inp,border:`1px solid ${editQ.ans===oi?C.green:C.border}`}} value={o} onChange={e=>setEditQ(eq=>({...eq,opts:eq.opts.map((x,i)=>i===oi?e.target.value:x)}))} placeholder={`Option ${LETTERS[oi]}`}/>
              </label>
            ))}
          </div>
          <div style={{fontSize:12,color:C.gray,marginBottom:12}}>Radio sélectionné = bonne réponse</div>
          <div style={{display:"flex",gap:8}}>
            <Btn ch="Enregistrer" full onClick={saveEdit} dis={!editQ.q.trim()}/>
            <Btn ch="Annuler" v="ghost" onClick={()=>setEditQ(null)}/>
          </div>
        </div>
      </div>}

      {/* ── Top bar ── */}
      <div style={{position:"sticky",top:0,zIndex:10,background:"#f4f3f0",paddingBottom:8,paddingTop:4}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <button onClick={onBack} style={{background:"none",border:"none",color:C.green,fontSize:20,cursor:"pointer",padding:"4px 6px",borderRadius:8,lineHeight:1,flexShrink:0}}>←</button>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,color:C.gray,fontWeight:500,letterSpacing:.3}}>{isCO?"🎧 COMPRÉHENSION ORALE":"📖 COMPRÉHENSION ÉCRITE"}</div>
            <div style={{fontSize:14,fontWeight:600,color:"#1a1a1a",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{test.title}</div>
          </div>
          <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:20,padding:"3px 12px",fontSize:13,fontWeight:600,color:answered===total?scoreColor:"#1a1a1a",flexShrink:0,minWidth:60,textAlign:"center"}}>
            {answered===total?`${score}/${total}`:`${answered}/${total}`}
          </div>
        </div>
        {/* Progress bar */}
        <div style={{height:4,background:"#e0deda",borderRadius:4,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(answered/total)*100}%`,background:answered===total?scoreColor:C.green,borderRadius:4,transition:"width .3s ease"}}/>
        </div>
      </div>

      {/* ── All-done score card ── */}
      {allDone&&<div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:20,padding:"1.25rem 1.5rem",marginBottom:16,display:"flex",alignItems:"center",gap:16}}>
        <div style={{width:64,height:64,borderRadius:"50%",background:scoreBg,border:`3px solid ${scoreColor}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <span style={{fontSize:17,fontWeight:700,color:scoreColor,lineHeight:1}}>{pct}%</span>
          <span style={{fontSize:10,color:scoreColor,fontWeight:500}}>{score}/{total}</span>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:16,fontWeight:600,color:"#1a1a1a",marginBottom:2}}>{scoreLabel}</div>
          <div style={{fontSize:13,color:C.gray}}>{score} bonne{score!==1?"s":""} réponse{score!==1?"s":""} sur {total}</div>
        </div>
        <button onClick={()=>setAns({})} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:12,padding:"6px 12px",fontSize:13,cursor:"pointer",color:C.gray,fontWeight:500,flexShrink:0}}>↺ Retry</button>
      </div>}

      {/* ── Global audio ── */}
      {isCO&&test.audio&&<div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:16,padding:"12px 16px",marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:18}}>🎧</span>
        <audio controls controlsList="nodownload" src={test.audio} style={{flex:1,height:36}}/>
      </div>}

      {/* ── Full transcript ── */}
      {allDone&&test.transcript&&<div style={{background:"#f0f9ff",border:`1px solid #bfdbfe`,borderRadius:16,padding:"1rem 1.25rem",marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:600,color:"#3b82f6",marginBottom:8,letterSpacing:.3}}>📄 TRANSCRIPTION COMPLÈTE</div>
        <div style={{fontSize:13,lineHeight:1.8,color:"#1e3a5f"}} dangerouslySetInnerHTML={{__html:buildTranscript()}}/>
      </div>}

      {/* ── Questions ── */}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {test.questions.map((q,qi)=>{
          const selected=ans[qi];
          const revealed=selected!==undefined;
          const isCorrect=revealed&&selected===q.ans;

          return(
            <div key={qi} style={{background:"#fff",border:`1.5px solid ${revealed?(isCorrect?"#86efac":C.red+"88"):C.border}`,borderRadius:20,overflow:"hidden",transition:"border-color .25s"}}>

              {/* Question header */}
              <div style={{padding:"1rem 1rem 0.75rem"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:10}}>
                  <div style={{display:"flex",gap:8,alignItems:"flex-start",flex:1}}>
                    <span style={{background:revealed?(isCorrect?"#dcfce7":"#fee2e2"):"#f4f3f0",color:revealed?(isCorrect?C.green:C.red):"#888",borderRadius:10,fontWeight:700,fontSize:13,padding:"2px 8px",flexShrink:0,marginTop:2}}>{qi+1}</span>
                    <div style={{fontSize:14,fontWeight:500,color:"#1a1a1a",lineHeight:1.55}}>{q.q}</div>
                  </div>
                  
                </div>

                {/* Passage (CE) */}
                {!isCO&&q.passage&&<div style={{background:"#f8f7f4",borderLeft:`3px solid ${C.border}`,padding:"10px 12px",borderRadius:"0 10px 10px 0",marginBottom:10,fontSize:13,lineHeight:1.7,color:"#444"}}>{q.passage}</div>}

                {/* Audio + image (CO) */}
                {isCO&&q.image&&<img src={q.image} alt="" style={{width:"100%",borderRadius:10,marginBottom:8,display:"block",objectFit:"cover",maxHeight:180}}/>}
                {isCO&&q.audio&&<div style={{marginBottom:8}}>
                  <audio controls controlsList="nodownload" src={q.audio} style={{width:"100%",height:36,borderRadius:8}}/>
                </div>}

                {/* Options */}
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  {q.opts.map((o,oi)=>{
                    const isSelected=selected===oi;
                    const isRight=oi===q.ans;
                    let bg="transparent",border=`1px solid ${C.border}`,color="#444",fw=400;
                    if(revealed){
                      if(isRight){bg="#dcfce7";border=`1.5px solid #86efac`;color="#14532d";fw=600;}
                      else if(isSelected&&!isRight){bg="#fee2e2";border=`1.5px solid #fca5a5`;color="#7f1d1d";}
                    } else if(isSelected){
                      bg="#f0fdf4";border=`1.5px solid ${C.green}`;color=C.green;fw=500;
                    }
                    return(
                      <button key={oi} onClick={()=>handleSelect(qi,oi)} disabled={revealed} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:12,border,background:bg,color,fontSize:14,fontWeight:fw,cursor:revealed?"default":"pointer",textAlign:"left",transition:"all .2s",width:"100%"}}>
                        <span style={{width:24,height:24,borderRadius:8,border:`1.5px solid ${revealed?(isRight?"#86efac":isSelected?"#fca5a5":C.border):isSelected?C.green:C.border}`,background:revealed?(isRight?"#dcfce7":isSelected?"#fee2e2":"#f4f3f0"):isSelected?C.green+"22":"#f4f3f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,color:revealed?(isRight?C.green:isSelected?C.red:"#aaa"):isSelected?C.green:"#999"}}>
                          {revealed&&isRight?"✓":revealed&&isSelected&&!isRight?"✗":LETTERS[oi]}
                        </span>
                        <span style={{flex:1}}>{o}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* ── Inline result banner ── */}
              {revealed&&<div style={{margin:"0.75rem 1rem 1rem",borderRadius:14,overflow:"hidden"}}>
                <div style={{background:isCorrect?"#f0fdf4":"#fef2f2",border:`1px solid ${isCorrect?"#bbf7d0":"#fecaca"}`,borderRadius:14,padding:"10px 14px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:isCorrect?0:6}}>
                    <span style={{fontSize:18}}>{isCorrect?"✅":"❌"}</span>
                    <span style={{fontWeight:600,fontSize:14,color:isCorrect?C.green:C.red}}>{isCorrect?"Bonne réponse !":"Mauvaise réponse"}</span>
                  </div>
                  {!isCorrect&&<div style={{fontSize:13,color:"#444",paddingLeft:26}}>
                    <span style={{color:C.gray}}>Bonne réponse : </span>
                    <span style={{fontWeight:600,color:C.green}}>{LETTERS[q.ans]}. {q.opts[q.ans]}</span>
                  </div>}
                  {isCO&&q.transcript&&<div style={{marginTop:8,paddingLeft:0}}>
                    <div style={{background:"#fff",border:"1px solid #bfdbfe",borderRadius:10,padding:"8px 12px"}}>
                      <div style={{fontSize:11,fontWeight:600,color:"#60a5fa",marginBottom:4,letterSpacing:.3}}>📄 SCRIPT AUDIO</div>
                      {q.transcript

4. grammaire (Maitrise grammaticale) /5: Grammar and sentence structure. Assess: verb conjugation accuracy, gender/number agreement, preposition use, sentence structure variety, grammatical diversity.

KEY PHILOSOPHY: A few grammar errors can still yield B2 if the text is natural, clear, and well-structured. Score holistically — what level does this communicator demonstrate?`;
      const res=await fetch(userApiKey?"https://api.openai.com/v1/chat/completions":"/api/chat",{

  };

  const saveMistake=(q,given,correct,exp)=>{
    const m=[{q,given,correct,exp,date:new Date().toISOString()},...mistakes].slice(0,50);

  };

    else correct=val===exo.ans.toLowerCase()||val===exo.ans.toLowerCase().replace(/[.,!?]/g,"");

  });

    localStorage.setItem('tcf_ai_usage',JSON.stringify({...aiUsage,date:new Date().toDateString()}));

  const [editedQs,setEditedQs]=useState(()=>{try{const s=localStorage.getItem("tcf_editedQs");return s?JSON.parse(s):{};}catch{return{};}});

  }; // {testId: {qi: question}}

  const getMergedTest=t=>{const edits=editedQs[t.id]||{};if(!Object.keys(edits).length)return t;return {...t,questions:t.questions.map((q,i)=>edits[i]?{...q,...edits[i]}:q)};};

  const isLanding=page==="pricing"&&plan==="starter";
  const renderPage=()=>{
    if((page==="reading"||page==="listening")&&activeTest)return <TestRunner test={getMergedTest(activeTest)} onBack={()=>setActiveTest(null)} onEditQuestion={(qi,q)=>handleEditQuestion(activeTest.id,qi,q)}/>;
    switch(page){
      case "dashboard":return <Dashboard plan={plan} aiUsage={aiUsage} setPage={nav} ct={ct} cw={cw} ctests={ctests} gramData={null}/>;
      case "speaking":return <Speaking plan={plan} aiUsage={aiUsage} setAiUsage={setAiUsage} onUpgrade={()=>openUpgrade("Améliorez vos phrases au niveau B2/C1")} ct={ct} onAdd={handleAdd} userApiKey={userApiKey}/>;
      case "reading":return <TestList type="CE" plan={plan} onStart={t=>safeStart(t,"CE")} onAddTest={handleAddTest} onEditTest={handleEditTest} onDeleteTest={handleDeleteTest} customTests={ctests} onUpgrade={openUpgrade} testResults={testResults} onRefresh={refreshResults}/>;
      case "listening":return <TestList type="CO" plan={plan} onStart={t=>safeStart(t,"CO")} onAddTest={handleAddTest} onEditTest={handleEditTest} onDeleteTest={handleDeleteTest} customTests={ctests} onUpgrade={openUpgrade} testResults={testResults} onRefresh={refreshResults}/>;
      case "writing":return <Writing plan={plan} aiUsage={aiUsage} setAiUsage={setAiUsage} onUpgrade={()=>openUpgrade("Feedback IA expression écrite")} cw={cw} onAdd={handleAdd} userApiKey={userApiKey}/>;
      case "grammaire":return <Grammaire/>;
      case "pricing":return <Pricing plan={plan} setPlan={p=>{savePlan(p);setAiUsage({speak:0,write:0,coach:0});}} onUpgrade={key=>openUpgrade("",key)} isLanding={isLanding}/>;
      default:return <Pricing plan={plan} setPlan={p=>{savePlan(p);setAiUsage({speak:0,write:0,coach:0});}} onUpgrade={key=>openUpgrade("",key)} isLanding={isLanding}/>;
    }
  };

  return(
    <div style={{display:"flex",minHeight:"100vh",background:"#f4f3f0",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}}>
      {!isLanding&&<Sidebar page={page} setPage={nav} plan={plan} aiUsage={aiUsage} onUpgrade={()=>openUpgrade()} lang={lang} toggleLang={toggleLang}/>}
      <main style={{flex:1,padding:isLanding?"0":"1.75rem 2rem",overflowY:"auto",minWidth:0}}>{renderPage()}</main>
      {showUpgrade&&<UpgradeModal onClose={()=>setShowUpgrade(false)} currentPlan={plan} setPlan={p=>{savePlan(p);setAiUsage({speak:0,write:0,coach:0});}} reason={upgradeReason} initialPlan={upgradeTarget}/>}
      {testModal&&<TestAdminPanel type={testModal.type} editTest={testModal.editTest} onSave={handleSaveTest} onClose={()=>setTestModal(null)}/>}
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(e){return{hasError:true,error:e};}
  componentDidCatch(e,i){console.error(e,i);}
  render(){
    if(this.state.hasError)return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:16,padding:"2rem",textAlign:"center"}}>
        <div style={{fontSize:48}}>⚠️</div>
        <div style={{fontSize:18,fontWeight:600}}>Une erreur est survenue</div>
        <div style={{fontSize:14,color:"#64748b"}}>{this.state.error?.message||"Erreur inattendue"}</div>
        <button onClick={()=>this.setState({hasError:false,error:null})} style={{background:"#16a34a",color:"#fff",border:"none",borderRadius:8,padding:"10px 24px",fontSize:15,cursor:"pointer"}}>↺ Réessayer</button>
      </div>
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
